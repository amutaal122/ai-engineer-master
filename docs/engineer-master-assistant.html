<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineer Master Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concept: ink-dark workspace, hairline borders, one mint accent. The seven phase colors form the brand ring and tag every domain. */
:root{--bg:#f5f6f9;--panel:#ffffff;--side:#eceff4;--soft:#e8edf4;--line:#dde2ea;--fg:#0e1522;--mute:#5a667b;--accent:#07876f;--ink:#ffffff;--code:#0b101b;--codefg:#dde5f2;--glow:#07876f14;--err:#c8372b;--shadow:0 1px 2px #0b12200d,0 8px 24px #0b12200f;--font:"Inter",system-ui,sans-serif;--head:"Space Grotesk","Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a10;--panel:#0d121b;--side:#090d14;--soft:#141b27;--line:#1e2837;--fg:#e8edf6;--mute:#8896ac;--accent:#43e0bf;--ink:#03180f;--code:#060910;--codefg:#dde5f2;--glow:#43e0bf12;--err:#ff7b6e;--shadow:0 1px 2px #0006,0 10px 30px #0005;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a10;--panel:#0d121b;--side:#090d14;--soft:#141b27;--line:#1e2837;--fg:#e8edf6;--mute:#8896ac;--accent:#43e0bf;--ink:#03180f;--code:#060910;--codefg:#dde5f2;--glow:#43e0bf12;--err:#ff7b6e;--shadow:0 1px 2px #0006,0 10px 30px #0005;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 12% -10%,var(--glow),transparent 60%),var(--bg);color:var(--fg);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--mute)}
.mono{font-family:var(--mono)}
#app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%}
/* sidebar */
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px;gap:14px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px}
.logo{position:relative;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 12px var(--head);background:conic-gradient(var(--p1) 0 14.28%,var(--p2) 0 28.56%,var(--p3) 0 42.84%,var(--p4) 0 57.12%,var(--p5) 0 71.4%,var(--p6) 0 85.68%,var(--p7) 0 100%)}
.logo::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--side)}
.logo span{position:relative}
.brand b{display:block;font:700 15px var(--head);letter-spacing:-.01em}
.brand small{color:var(--mute);font-size:12px}
:root{--p1:#5ac8fa;--p2:#7c9cff;--p3:#4de0c3;--p4:#a3e635;--p5:#ffb454;--p6:#ff8a65;--p7:#f472b6}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:9px 10px;text-align:left;color:var(--mute)}
#nav button:hover{background:var(--soft);color:var(--fg)}
#nav button[aria-current=page]{background:var(--panel);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent),var(--shadow)}
#nav svg{width:17px;height:17px;flex:none}
#nav .n{margin-left:auto;font:500 11px var(--mono);color:var(--mute)}
.sec{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 8px}
#recent{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px}
#recent .r{display:flex;align-items:center;border-radius:8px}
#recent .r:hover,#recent .r.on{background:var(--panel)}
#recent .t{flex:1;min-width:0;background:none;border:0;text-align:left;padding:7px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
#recent .on .t,#recent .r:hover .t{color:var(--fg)}
#recent .x{opacity:0;background:none;border:0;color:var(--mute);padding:4px 8px}
#recent .r:hover .x,#recent .x:focus-visible{opacity:1}
.side-foot{display:flex;gap:8px}.side-foot .btn{flex:1}
/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.top h2{margin:0;font:600 17px var(--head);letter-spacing:-.01em;white-space:nowrap}
#burger{display:none}
.pal{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute);text-align:left}
.pal:hover{border-color:var(--accent)}
.pal span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow:auto}
.page{max-width:1120px;margin:0 auto;padding:22px 20px 40px}
.page h1{font:700 26px var(--head);letter-spacing:-.02em;margin:0 0 4px}
.page .lead{color:var(--mute);margin:0 0 18px}
/* chat */
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#thread{flex:1;min-height:0;overflow:auto}
#msgs{max-width:780px;margin:0 auto;padding:24px 20px 10px;display:flex;flex-direction:column;gap:26px}
.msg{display:flex;gap:13px;min-width:0}
.msg.user{justify-content:flex-end}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--head);position:relative;background:conic-gradient(var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1));margin-top:1px}
.av::before{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--bg)}
.av span{position:relative}
.body{min-width:0;max-width:100%;flex:1}
.msg.user .body{flex:none;background:var(--soft);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 15px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.6em 0;overflow-wrap:anywhere}
.md h3,.md h4,.md h5,.md h6{margin:1.1em 0 .4em;line-height:1.3;font-family:var(--head);letter-spacing:-.01em}
.md h3{font-size:19px}.md h4{font-size:16px}.md h5{font-size:14.5px}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}.md li{margin:.25em 0}
.md code{font:12.5px var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.md code.sk{color:var(--accent);cursor:pointer}
.md code.sk:hover{border-color:var(--accent)}
.md a{color:var(--accent)}
.code{margin:.8em 0;border-radius:12px;background:var(--code);color:var(--codefg);overflow:hidden;border:1px solid var(--line)}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 14px;font:12px var(--mono);color:#8896ac;border-bottom:1px solid #1e2837}
.codebar button{background:none;border:0;color:#8896ac;padding:3px 8px}
.code pre{margin:0;padding:13px 14px;overflow-x:auto}
.code pre code{background:none;border:0;padding:0;color:inherit;font:13px/1.55 var(--mono)}
.cursor{display:inline-block;width:7px;height:1.05em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.err{color:var(--err)}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.src>small{color:var(--mute);font-size:12px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 8px;color:var(--fg)}
button.chip:hover{border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.acts{display:flex;gap:2px;margin-top:8px}
.acts button{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 8px;border-radius:6px}
.acts button:hover{color:var(--fg);background:var(--soft)}
.acts button[aria-pressed=true]{color:var(--accent);font-weight:600}
.hero{max-width:780px;margin:0 auto;padding:7vh 20px 0;text-align:center}
.ring{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;position:relative;display:grid;place-items:center;font:700 26px var(--head);background:conic-gradient(var(--p1) 0 14.28%,var(--p2) 0 28.56%,var(--p3) 0 42.84%,var(--p4) 0 57.12%,var(--p5) 0 71.4%,var(--p6) 0 85.68%,var(--p7) 0 100%);animation:spin 24s linear infinite}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;animation:spin 24s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font:700 34px/1.12 var(--head);letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
.hero p{color:var(--mute);margin:0 auto 24px;max-width:56ch}
.stats{display:flex;justify-content:center;gap:22px;margin-bottom:26px;flex-wrap:wrap}
.stats div{font:500 12px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 22px var(--head);color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pc:hover{transform:translateY(-2px);border-color:var(--accent)}
.pc b{display:block;font:600 14px var(--head);margin-bottom:2px}
.pc small{color:var(--mute)}
footer.comp{padding:6px 20px 14px;position:relative}
#hints{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;width:min(740px,calc(100% - 40px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;margin-bottom:-2px}
#hints.on{display:block}
#hints button{display:flex;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left}
#hints button:hover{background:var(--soft)}
#hints code{font:500 13px var(--mono);color:var(--accent);min-width:74px}
#hints span{color:var(--mute)}
#composer{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px 9px 9px 16px;box-shadow:var(--shadow)}
#composer:focus-within{border-color:var(--accent)}
#input{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;max-height:190px;padding:6px 0;line-height:1.5}
#send{width:38px;height:38px;border-radius:12px;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--ink);border:0}
#send:disabled{opacity:.35;cursor:not-allowed}
#note{max-width:780px;margin:7px auto 0;text-align:center;font-size:12px;color:var(--mute)}
#ctx{width:310px;flex:none;border-left:1px solid var(--line);padding:18px 16px;overflow:auto;display:none}
@media (min-width:1180px){#ctx{display:block}}
#ctx h3{margin:0 0 4px;font:600 13px var(--head);letter-spacing:.02em}
#ctx p.s{margin:0 0 14px;color:var(--mute);font-size:12.5px}
.sc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;transition:border-color .15s}
.sc:hover{border-color:var(--accent)}
.sc b{display:flex;align-items:center;gap:7px;font:500 13px var(--mono)}
.sc span{display:block;color:var(--mute);font-size:12.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* grids */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:200px;max-width:380px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.fchips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--mute)}
.fchips button:hover{color:var(--fg);border-color:var(--accent)}
.fchips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fchips em{font:normal 11px var(--mono);opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.role{border-style:dashed;box-shadow:none;cursor:default}
.card.role:hover{transform:none;border-color:var(--line)}
.card h4{margin:0;display:flex;align-items:center;gap:8px;font:500 13.5px var(--mono);overflow-wrap:anywhere}
.card p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tg{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tg span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
.gh{font:600 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
/* pipeline */
.flow{display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px}
.node{flex:1 0 128px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;position:relative;padding:0 4px;color:var(--mute)}
.node::before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);z-index:0}
.node:first-child::before{display:none}
.node.done::before{background:var(--c);opacity:.7}
.node i{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--head);font-style:normal;background:var(--panel);border:2px solid var(--c);color:var(--c);transition:transform .2s,background .2s}
.node:hover i{transform:scale(1.08)}
.node[aria-pressed=true] i{background:var(--c);color:#0a0e14;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.node[aria-pressed=true]{color:var(--fg)}
.node b{font:600 13px var(--head)}
.pd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.pd h3{margin:0 0 4px;font:700 22px var(--head);letter-spacing:-.02em}
.pd .l{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.pd .row{display:flex;flex-wrap:wrap;gap:6px}
.role-chip{font:500 12px var(--mono);border:1px dashed var(--line);border-radius:99px;padding:3px 10px;color:var(--mute)}
.role-chip.has{border-style:solid;color:var(--fg);cursor:pointer;background:var(--panel)}
.role-chip.has:hover{border-color:var(--accent)}
/* drawer, palette, dialog */
#scrim{display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px #0006;transform:translateX(104%);transition:transform .22s;z-index:40;display:flex;flex-direction:column}
#drawer.on{transform:none}
#dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
#dh h3{margin:0;flex:1;min-width:0;font:600 15px var(--mono);overflow-wrap:anywhere}
#db{flex:1;overflow:auto;padding:16px}
#db .l{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 7px}
#db p{margin:0 0 6px}
#db ul{margin:0;padding-left:1.2em}#db li{margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags>span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--soft)}
#df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}#df .btn{flex:1}
#back{display:none;position:fixed;inset:0;background:#0007;z-index:39}
#back.on{display:block}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);padding:0;box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#0009}
#pal{width:min(620px,calc(100% - 28px));margin-top:12vh}
#pq{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 18px;font-size:16px;outline:0}
#pr{max-height:50vh;overflow:auto;padding:6px}
#pr button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:9px 12px;text-align:left}
#pr button[aria-selected=true]{background:var(--soft)}
#pr .ty{font:500 11px var(--mono);color:var(--mute);width:56px;flex:none;text-transform:uppercase}
#pr .lb{font:500 13px var(--mono)}#pr .sb{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#sform{padding:20px;display:flex;flex-direction:column;gap:12px;width:min(470px,calc(100vw - 28px))}
#sform h2{margin:0;font:700 19px var(--head)}
#sform label{display:flex;flex-direction:column;gap:4px;font-weight:500}
#sform input[type=text],#sform input[type=password],#sform select,#sform textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
#sform small{color:var(--mute);font-weight:400}
#sform .check{flex-direction:row;align-items:center;gap:8px;font-weight:400}
#sform .row{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;inset:0 auto 0 0;width:min(290px,88%);z-index:30;transform:translateX(-103%);transition:transform .2s}
  body.nav #side{transform:none}
  body.nav #scrim{display:block;position:fixed;inset:0;background:#0007;z-index:29}
  #burger{display:inline-grid}
  .pal b,.pal kbd{display:none}
  .cards{grid-template-columns:1fr}
  .pd{grid-template-columns:1fr}
  .hero h1{font-size:27px}
  .top{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <aside id="side" aria-label="Navigation">
    <div class="brand"><div class="logo"><span>AEM</span></div><div><b>Engineer Master</b><small>Skill assistant</small></div></div>
    <nav id="nav"></nav>
    <div class="sec">Recent chats</div>
    <div id="recent"></div>
    <div class="side-foot"><button class="btn" id="gear">Settings</button><button class="btn" id="theme">Theme</button></div>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <header class="top">
      <button class="btn ghost" id="burger" aria-label="Open menu">&#9776;</button>
      <h2 id="vt">Assistant</h2>
      <button class="pal" id="palBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search skills, agents, commands</span><kbd>Ctrl K</kbd></button>
    </header>

    <section class="view" id="v-chat">
      <div class="chatcol">
        <div id="thread" tabindex="0" aria-label="Conversation"><div id="msgs" aria-live="polite"></div></div>
        <footer class="comp">
          <div id="hints" role="listbox"></div>
          <form id="composer">
            <textarea id="input" rows="1" placeholder="Describe what you are building, or type / for commands" aria-label="Message"></textarea>
            <button id="send" type="submit" aria-label="Send"></button>
          </form>
          <p id="note"></p>
        </footer>
      </div>
      <aside id="ctx" aria-label="Sources"></aside>
    </section>

ing to an MCP-compatible agent framework.\n- Prefer `agent-browser skills get core` to load the official interaction skill set.\n- Do not share a browser daemon between untrusted contexts.\n\n---\n\n## Install\n\n[code]\n\n---\n\n## Core commands\n\n[code]\n\n---\n\n## MCP server mode\n\n[code]\n\nThen register `agent-browser mcp` as a tool server in your agent's MCP config:\n[code]\n\n---\n\n## Skills integration\n\n[code]\n\n---\n\n## Typical agent loop\n\n[code]\n\n---\n\n## Caveats\n- 52k+ GitHub stars; Apache-2.0 license.\n- Refs are only valid for the current snapshot — always re-snapshot after any navigation or DOM mutation.\n- The daemon stays running between commands; call `close` explicitly when done.","core":true},{"id":"agent-desktop","name":"Agent Desktop","domain":"Agents","desc":"Computer-use CLI that lets an AI agent see and operate desktop apps on macOS, Windows, and Linux through the OS accessibility tree instead of screenshots and pixel matching. Covers snapshots, element refs, the 61 commands, MCP mode, per-OS permissions, and the retry rules that keep an automation from flailing.","triggers":["agent-desktop","computer use","desktop automation","control desktop app","accessibility tree","ax api","ui automation","at-spi","automate gui","operate an app","desktop agent","screenshot free automation"],"rules":[],"body":"# Agent Desktop Skill\n\n## § RULES\n- Refs belong to the snapshot that produced them. A bare `@e8` is rejected — always pass the full `@snapshot:element` form.\n- On `STALE_REF` or `AMBIGUOUS_TARGET`, take a **new snapshot**. Never retry the old ref.\n- Retry a failed command only when `error.disposition.retry` is `safe`. Anything else means re-observe first.\n- Snapshots, screenshots, and clipboard reads can contain private desktop content — keep them out of logs, uploads, and transcripts.\n- There is no model inside: the observe → act → verify loop is the calling agent's job.\n\n---\n\n## What makes it different\n\nScreenshot-based security","name":"Codex Security","domain":"Quality & Security","desc":"OpenAI's Codex Security CLI and TypeScript SDK for finding, validating, and fixing security vulnerabilities in a codebase — repo and diff scans, deep mode, SARIF/JSON/CSV export, threat models, SECURITY.md drafting, and a GitHub Action for CI. Use for security review of a repo or a pull request.","triggers":["codex security","codex-security","cs scan","security scan","vulnerability scan","find vulnerabilities","sast","threat model","security.md","sarif","security ci","scan pull request"],"rules":[],"body":"# Codex Security Skill\n\n## § RULES\n- Scan the **diff** on pull requests (`--diff origin/main`) and the full repo on a schedule. Full scans on every PR waste money and bury signal.\n- Findings are candidates until validated. Triage before filing — a raw scan is not a vulnerability report.\n- Never commit an API key. In CI use the `CODEX_SECURITY_API_KEY` secret; locally use `cs login`.\n- Cost is real and the cap is advisory: the sample Action estimates $5 per scan and the README warns requests already in flight can exceed the limit. Set `--max-time` and scope with `--path`.\n- Report without failing the build at first. Turn on blocking only once the false-positive rate is known.\n\n---\n\n## Install\n\n[code]\n\nRequirements: Node.js 22.13.0+ within 22.x, or 24.x or 26.x, plus Python 3.10+. Python 3.10 also needs `tomli`.\n\nNo global install, or an npm `EEXIST` conflict:\n\n[code]\n\n`cs` and `codex-security` are the same CLI.\n\n---\n\n## Scanning\n\n[code]\n\nOutput is a Markdown report at the printed REPORT path.\n\n[code]\n\n---\n\n## Policies and threat models\n\n[code]\n\nOmit `--scan` to export from the latest ","core":true},{"id":"docker","name":"docker","domain":"Infra & DevOps","desc":"Docker and Docker Compose — Dockerfile authoring, multi-stage builds, layer caching, compose services, networking, volumes, secrets, and production patterns.","triggers":["docker","dockerfile","doc ings)\n- Never return internal errors to clients — log them, return generic message\n- Background tasks for fire-and-forget (logging, notifications)\n- Streaming for LLM responses — always use SSE","core":true},{"id":"freellmapi","name":"FreeLLMAPI","domain":"LLM & AI","desc":"Self-hosted router that exposes one OpenAI-compatible endpoint backed by ~87 free-tier providers (~1,300 model endpoints). No cloud billing — provider keys are encrypted locally and the router handles failover, rate-limit tracking, and model selection automatically.","triggers":["freellmapi","free llm","free api","llm router","free models","openai compatible free","local llm router","llm proxy","free tier llm","aggregate llm"],"rules":[],"body":"# FreeLLMAPI Skill\n\n## § RULES\n- Always set `base_url` to your FreeLLMAPI instance; never hard-code a provider URL.\n- Prefer `model=\"auto\"` for general tasks; use `auto:fast` for latency-sensitive paths and `auto:smart` for quality-critical ones.\n- Read `X-Routed-Via` headers in production to log which provider actually served each request.\n- Run one instance per developer; treat the unified key like a secret — never commit it.\n- For Claude Code integration use `npx freellmapi setup-claude` rather than editing config by hand.\n\n## Install\n\n### Docker (recommended)\n[code]\n\n### Windows desktop app\nDownload the `.exe` from GitHub Releases or install from the Microsoft Store.\n\n### From source\n[code]\n\nAfter install: open the dashboard → **Keys** page → add provider API keys (OpenAI, Anthropic, Google, Groq, etc.) → copy the unified `freellmapi-...` bearer token.\n\n---\n\n## Basic usage — Python (openai SDK)\n\n[code]\n\n### Streaming\n[code]\n\n---\n\n## Model selection\n\n| `model=` value | Behaviour |\n|---|---|\n| `auto` | Router picks the best available free model |\n| `auto:fast` | Optimise for lowest","core":true},{"id":"git-workflow","name":"git-workflow","domain":"Infra & DevOps","desc":"Implement Git branching strategies, PR workflows, and release management","triggers":["git workflow","branching strategy","git flow","feature branch","pull request workflow","release branch","git strategy"],"rules":[],"body":"# Git Workflow\n\nImplement effective branching strategies and pull request workflows for team collaboration.\n\n## When to Use This Skill\n\nUse this skill when:\n- Establishing team Git workflows\n- Implementing branching strategies\n- Configuring pull request processes\n- Setting up release management\n- Improving code review practices\n\n## Prerequisites\n\n- Git installed\n- Repository hosting (GitHub, GitLab, Bitbucket)\n- Basic Git knowledge\n\nRepository instructions and branch protection take precedence over every generic example here. Rebase/reset/force-push only within authorized topic history; preserve dirty work, never rewrite shared history silently, and use repository release scripts when required. Stage explicit reviewed paths rather than unrelated files.\n\n## Branching Strategies\n\n### Trunk-Based Development\n\nBest for: Continuous deployment, small teams, mature CI/CD\n\n[code]\n\n[code]\n\n### GitHub Flow\n\nBest for: Continuous delivery, web applications\n\n[code]\n\n[code]\n\n### GitFlow\n\nBest for: Scheduled releases, versioned products\n\n[code]\n\n[code]\n\n## Commit Conventions\n\n### Conventional Commi","core":true},{"id":"github-actions","name":"github-actions","domain":"Infra & DevOps","desc":"GitHub Actions — CI/CD workflows, caching, matrix builds, secrets, Docker publishing, deploy pipelines, reusable workflows, and AI/ML pipeline patterns.","triggers":["github actions","gh actions","ci cd","github workflow","yml workflow","github pipeline","actions cache","docker push github","deploy github actions","matrix build"],"rules":["Pin action versions to SHA for security: `actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683`","Use `GITHUB_TOKEN` for ghcr.io — no separate secret needed","Set `cancel-in-progress: true` — saves CI minutes on fast pushes","Never put secrets in `run:` steps — use `env:` instead","Matrix builds for Python version compat; skip for internal services"],"body":"# GitHub Actions\n\n## Basic CI (Python)\n[code]\n\n## Docker build + push\n[code]\n\n## Caching (pip / uv / npm)\n[code]\n\n## Secrets and environments\n[code]\n\n## Reusable workflows\n[code]\n\n## AI/ML pipeline\n[code]\n\n## Useful patterns\n[code]\n\n## Rules\n- Pin action versions to SHA for security: `actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683`\n- Use `GITHUB_TOKEN` for ghcr.io — no separate secret needed\n- Set `cancel-in-progress: true` — saves CI minutes on fast pushes\n- Never put secrets in `run:` steps — use `env:` instead\n- Matrix builds for Python version compat; skip for internal services","core":true},{"id":"gpt-chat-ui","name":"gpt-chat-ui","domain":"UI & Apps","desc":"Build a ChatGPT-style GPT chat application - streaming UI, message model, markdown and code rendering, tool calls, conversation history, FastAPI + OpenAI/Claude backend, and production polish.","triggers":["gpt","chatgpt","chat ui","chat interface","chatbot","chat app","gpt clone","streaming chat","conversation ui","openai chat","assistant ui","sse","message list","copilot ui"],"rules":["API key server-side only; validate every request with Pydantic.","Sanitize rendered markdown; treat model output as untrusted.","Every thread has stop, retry and error states.","Stream by default; never block the UI on a full response."],"body":"# GPT Chat UI\n\n## §ARCHITECTURE\n[code]\nKeep the API key on the server only. The browser never sees it.\n\n## §MESSAGE MODEL\n[code]\n\n## §BACKEND (FastAPI + SSE streaming)\n[code]\nSwap the call for `anthropic.AsyncAnthropic().messages.stream(...)` to use Claude; the SSE contract stays the same.\n\n## §FRONTEND (stream reader)\n[code]\nStop button = `AbortController.abort()`.\n\n## §UI LAYOUT (the ChatGPT shape)\n| Zone | Behavior |\n|---|---|\n| Sidebar | New chat, grouped history (Today / 7 days / Older), search, collapse on mobile |\n| Thread | Centered column ~720px, user right/bubble, assistant left/plain text |\n| Composer | Auto-grow textarea, Enter send, Shift+Enter newline, send becomes Stop while streaming |\n| Header | Model picker, share/export, theme toggle |\n| Empty state | Greeting + 4 suggestion chips that fill the composer |\n\n## §MESSAGE RENDERING\n- Markdown via `marked` + sanitize with DOMPurify (never inject raw model HTML).\n- Code blocks: language label, Copy button, monospace, horizontal scroll inside block.\n- Show a typing cursor while streaming; re-render markdown on a rAF throt","core":true},{"id":"gpt-oss","name":"GPT-OSS (gpt-oss-120b / gpt-oss-20b)","domain":"LLM & AI","desc":"OpenAI's open-weight MoE reasoning models (Apache-2.0). gpt-oss-120b fits one 80GB GPU; gpt-oss-20b fits 16GB. Both support configurable reasoning effort, function calling, browsing, Python execution, and Structured Outputs. Must be used with the openai-harmony response format.","triggers":["gpt-oss","gpt-oss-120b","gpt-oss-20b","openai open model","open weight reasoning","openai open source","harmony format","gpt oss","openai gpt-oss"],"rules":[],"body":"# GPT-OSS Skill\n\n## § RULES\n- Always use the `openai-harmony` package to render prompts and parse responses — without it, model outputs will be malformed.\n- Use `temperature=1.0, top_p=1.0` for sampling (model is trained for these values).\n- Download weights with the Hugging Face CLI, not `git clone` (repo contains no weights).\n- On Windows, use Ollama or LM Studio — the reference implementations require CUDA/Linux.\n- Triton and Torch reference code is for education, not production; use vLLM or Transformers for production serving.\n\n---\n\n## Install\n\n[code]\n\nPython 3.12 required. macOS: `xcode-select --install` first.\n\n### Download weights (Hugging Face)\n[code]\n\n---\n\n## Quickest start — Transformers\n\n[code]\n\nThe Transformers chat template handles `openai-harmony` automatically.\n\n---\n\n## vLLM server (production)\n\n[code]\n\nThen query with the standard OpenAI client pointing at `http://localhost:8000/v1`.\n\n---\n\n## Ollama (macOS / Windows)\n\n[code]\n\n---\n\n## LM Studio\n\n[code]\n\n---\n\n## openai-harmony API (direct use)\n\n[code]\n\n---\n\n## Reasoning effort\n\n| `reasoning_effort` | Tokens used | Use f","core":true},{"id":"graphql","name":"graphql","domain":"Backend","desc":"GraphQL gives clients exactly the data they need - no more, no","triggers":["graphql","gql","schema definition","resolver","subscription","graphql query","apollo","strawberry graphql","graphql mutation"],"rules":[],"body":"# GraphQL\n\nGraphQL gives clients exactly the data they need - no more, no less. One\nendpoint, typed schema, introspection. But the flexibility that makes it\npowerful also makes it dangerous. Without proper controls, clients can\ncraft queries that bring down your server.\n\nThis skill covers schema design, resolvers, DataLoader for N+1 prevention,\nfederation for microservices, and client integration with Apollo/urql.\nKey insight: GraphQL is a contract. The schema is the API documentation.\nDesign it carefully.\n\n2025 lesson: GraphQL isn't always the answer. For simple CRUD, REST is\nsimpler. For high-performance public APIs, REST with caching wins. Use\nGraphQL when you have complex data relationships and diverse client needs.\n\n## Detailed Guide\n\nRead [the detailed guide](references/detailed-guide.md) before executing this skill. It retains the complete procedure and reference material. Treat its safety, prerequisites, and validation requirements as mandatory. For focused work, load the relevant sections; for end-to-end work, read the guide completely.\n\n## When to Use\n- User mentions or imp","core":true},{"id":"huggingface","name":"huggingface","domain":"LLM & AI","desc":"HuggingFace — transformers, datasets, PEFT fine-tuning, model hub, inference, embeddings, and production deployment for ML engineers.","triggers":["huggingface","transformers","model hub","fine-tuning","peft","lora","datasets","pipeline","tokenizer","bert","llama","mistral","embedding model","hf"],"rules":["Always set `device_map=\"auto\"` for multi-GPU or large models","Use `bfloat16` over `float16` (more stable training)","LoRA: start with `r=8`, increase if underfitting","Cache downloads: `HF_HOME=/data/hf_cache` env var","For production: use TGI or vLLM — not raw transformers"],"body":"# HuggingFace\n\n## Quick inference (pipeline)\n[code]\n\n## Tokenizer + model (full control)\n[code]\n\n## Datasets\n[code]\n\n## Fine-tuning with PEFT/LoRA\n[code]\n\n## Sentence Transformers (embeddings)\n[code]\n\n## Quantization (run large models on less VRAM)\n[code]\n\n## Inference API (serverless)\n[code]\n\n## Model card checklist\n| Field | Required |\n|---|---|\n| Model description | ✅ |\n| Training data | ✅ |\n| Evaluation results | ✅ |\n| Intended use / limitations | ✅ |\n| License | ✅ |\n| CO2 emissions | Optional |\n\n## Popular model families\n| Use case | Model | Size |\n|---|---|---|\n| Embedding | `BAAI/bge-large-en-v1.5` | 335M |\n| Reranking | `BAAI/bge-reranker-v2-m3` | 568M |\n| Classification | `distilbert-base-uncased` | 66M |\n| Generation (small) | `Qwen/Qwen2.5-3B-Instruct` | 3B |\n| Generation (mid) | `meta-llama/Llama-3.1-8B-Instruct` | 8B |\n| Code | `Qwen/Qwen2.5-Coder-7B-Instruct` | 7B |\n\n## Rules\n- Always set `device_map=\"auto\"` for multi-GPU or large models\n- Use `bfloat16` over `float16` (more stable training)\n- LoRA: start with `r=8`, increase if underfitting\n- Cache downloads: `HF_HOME=","core":true},{"id":"karpathy-guidelines","name":"Karpathy Guidelines","domain":"Meta","desc":"A CLAUDE.md ruleset derived from Andrej Karpathy's observations on LLM coding pitfalls — think before coding, simplicity first, surgical changes, goal-driven execution. Use when an AI coding agent is over-engineering, touching unrelated files, inventing abstractions, or declaring success without verifying.","triggers":["karpathy","karpathy guidelines","claude.md rules","agent over-engineering","llm coding pitfalls","simplicity first","surgical changes","stop over engineering","coding guidelines","agent discipline"],"rules":[],"body":"# Karpathy Guidelines Skill\n\n## § RULES\n- State assumptions out loud before writing code. If genuinely confused, ask rather than guess.\n- Write the minimum code that solves the stated problem. Nothing speculative, no \"we might need this later\".\n- Touch only what the task requires. Mention unrelated dead code; do not delete it as a bonus.\n- Define success criteria first, write the test, then loop until it actually passes.\n- These bias toward caution over speed. On trivial tasks, use judgement rather than ceremony.\n\n---\n\n## The four principles\n\n### 1. Think Before Coding\nSurface the tradeoffs and assumptions *before* the diff exists. An agent that starts typing immediately has already committed to an architecture nobody reviewed.\n\n### 2. Simplicity First\nThe failure mode is not too little code — it is a factory, an interface, and a config flag where one function was asked for.\n\n### 3. Surgical Changes\nScope creep in an agent looks like helpfulness. Renaming variables, reformatting, and \"cleaning up\" an adjacent file all make the diff unreviewable.\n\n### 4. Goal-Driven Execution\n\"Should ","core":true},{"id":"kubernetes","name":"kubernetes","domain":"Infra & DevOps","desc":"Kubernetes — deployments, services, ingress, ConfigMaps, secrets, HPA, resource limits, health checks, namespaces, and production patterns for deploying AI/ML services.","triggers":["kubernetes","k8s","kubectl","deployment yaml","kubernetes pod","k8s ingress","hpa autoscaling","kubernetes secret","kubernetes configmap","helm","kubernetes service"],"rules":["Never use `latest` tag — pin to exact image digest or semver","Always set resource `requests` AND `limits` — prevents noisy neighbor","`maxUnavailable: 0` for zero-downtime rolling deploys","Liveness ≠ Readiness: liveness restarts the pod; readiness removes it from load balancer","Store secrets in Vault or External Secrets Operator — not in git"],"body":"# Kubernetes\n\n## Deployment (production pattern)\n[code]\n\n## Service + Ingress\n[code]\n\n## ConfigMap + Secret\n[code]\n\n## Horizontal Pod Autoscaler\n[code]\n\n## Essential kubectl commands\n[code]\n\n## Resource sizing for AI workloads\n| Workload | CPU request | Memory request | Notes |\n|---|---|---|---|\n| FastAPI (no ML) | 250m | 256Mi | Light |\n| FastAPI + LLM client | 500m | 512Mi | API calls only |\n| Embedding model (small) | 2000m | 2Gi | CPU inference |\n| GPU inference pod | 500m CPU | 8Gi + 1 GPU | Use node selector |\n\n[code]\n\n## Rules\n- Never use `latest` tag — pin to exact image digest or semver\n- Always set resource `requests` AND `limits` — prevents noisy neighbor\n- `maxUnavailable: 0` for zero-downtime rolling deploys\n- Liveness ≠ Readiness: liveness restarts the pod; readiness removes it from load balancer\n- Store secrets in Vault or External Secrets Operator — not in git\n- Namespaces: `production`, `staging`, `dev` — RBAC per namespace","core":true},{"id":"langchain","name":"langchain","domain":"LLM & AI","desc":"LangChain — chains, RAG pipelines, agents, memory, vector stores, document loaders, and LangSmith observability for LLM applications.","triggers":["langchain","langchain rag","langchain agent","langchain chain","langchain memory","langchain vectorstore","lcel","langsmith","retrieval augmented generation","langchain tools"],"rules":["Use LCEL (`|` operator) not legacy `LLMChain` — composable, streamable, traceable","`RecursiveCharacterTextSplitter` with `chunk_overlap=200` for most RAG use cases","Always add LangSmith tracing in dev — invaluable for debugging retrieval","Use `PydanticOutputParser` over JSON mode — catches malformed outputs at parse time","For production RAG: hybrid search (semantic + keyword) + reranking beats pure vector search"],"body":"# LangChain\n\n## Install\n[code]\n\n## LCEL (LangChain Expression Language) — compose chains\n[code]\n\n## RAG pipeline\n[code]\n\n## Structured output from chain\n[code]\n\n## Conversation memory\n[code]\n\n## LangSmith (tracing + eval)\n[code]\n\n## Document loaders\n[code]\n\n## Rules\n- Use LCEL (`|` operator) not legacy `LLMChain` — composable, streamable, traceable\n- `RecursiveCharacterTextSplitter` with `chunk_overlap=200` for most RAG use cases\n- Always add LangSmith tracing in dev — invaluable for debugging retrieval\n- Use `PydanticOutputParser` over JSON mode — catches malformed outputs at parse time\n- For production RAG: hybrid search (semantic + keyword) + reranking beats pure vector search","core":true},{"id":"llm-evaluation","name":"llm-evaluation","domain":"LLM & AI","desc":"Master comprehensive evaluation strategies for LLM applications, from automated metrics to human evaluation and A/B testing.","triggers":["llm eval","model evaluation","golden set","eval metrics","llm benchmark","ragas","deepeval","judge model","eval strategy"],"rules":[],"body":"# LLM Evaluation\n\nMaster comprehensive evaluation strategies for LLM applications, from automated metrics to human evaluation and A/B testing.\n\n## Do not use this skill when\n\n- The task is unrelated to llm evaluation\n- You need a different domain or tool outside this scope\n\n## Instructions\n\n- Clarify goals, constraints, and required inputs.\n- Apply relevant best practices and validate outcomes.\n- Provide actionable steps and verification.\n- Use the examples below; no separate implementation playbook is bundled.\n\n## Use this skill when\n\n- Measuring LLM application performance systematically\n- Comparing different models or prompts\n- Detecting performance regressions before deployment\n- Validating improvements from prompt changes\n- Building confidence in production systems\n- Establishing baselines and tracking progress over time\n- Debugging unexpected model behavior\n\n## Core Evaluation Types\n\n### 1. Automated Metrics\nFast, repeatable, scalable evaluation using computed scores.\n\n**Text Generation:**\n- **BLEU**: N-gram overlap (translation)\n- **ROUGE**: Recall-oriented (summarization)\n- *","core":true},{"id":"magic-mcp","name":"Magic MCP","domain":"UI & Apps","desc":"21st.dev's MCP server for UI — search 10,000+ React/Tailwind components, generate new ones with AI, fetch logos, and publish your own, from Cursor, Claude Code, Windsurf or Codex. Covers the legacy @21st-dev/magic proxy, the current 21st MCP endpoint, tool renames, and the AI-access gate.","triggers":["magic mcp","21st dev","21st mcp","generate ui component","react tailwind components","component search","logo search","v0 alternative","ui generation mcp","21st_magic_component_builder"],"rules":[],"body":"# Magic MCP Skill\n\n## § RULES\n- `generate` and `iterate_generation` only appear when AI access is enabled. Check `get_usage.aiGenerationEnabled` before calling them.\n- On `ai_subscription_required`, **stop** — do not retry until AI access is actually enabled. Retrying burns calls and never succeeds.\n- With AI off, the workflow is `search` → `get_component` → adapt the code yourself. That path always works.\n- Old Magic API keys were reset. A pre-v0.2.0 key will fail; issue a new one.\n- Generated components are a starting point. Review them against your own design tokens before merging.\n\n---\n\n## What changed\n\n`@21st-dev/magic` is now a **stdio compatibility proxy** (since v0.2.0) that forwards to the 21st MCP server. It exists to keep old configs working. New setups should point at the HTTP endpoint directly.\n\n---\n\n## Install\n\n[code]\n\n`--client` takes `cursor | claude | vscode | windsurf | codex`.\n\nClaude Code plugin:\n\n[code]\n\nLegacy proxy, if you need it:\n\n[code]\n\n---\n\n## Manual MCP config\n\n[code]\n\nGet a key at https://21st.dev/mcp. Plugins read `API_KEY_21ST`; the proxy also accepts ","core":true},{"id":"mcp-builder","name":"mcp-builder","domain":"Agents","desc":"Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).","triggers":["mcp server","mcp tool","model context protocol","mcp builder","mcp integration","mcp resource","build mcp","mcp transport"],"rules":[],"body":"# MCP Server Development Guide\n\n## Overview\n\nCreate MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. The quality of an MCP server is measured by how well it enables LLMs to accomplish real-world tasks.\n\n---\n\n# Process\n\n## 🚀 High-Level Workflow\n\nCreating a high-quality MCP server involves four main phases:\n\n### Phase 1: Deep Research and Planning\n\n#### 1.1 Understand Modern MCP Design\n\n**API Coverage vs. Workflow Tools:**\nBalance comprehensive API endpoint coverage with specialized workflow tools. Workflow tools can be more convenient for specific tasks, while comprehensive coverage gives agents flexibility to compose operations. Performance varies by client—some clients benefit from code execution that combines basic tools, while others work better with higher-level workflows. When uncertain, prioritize comprehensive API coverage.\n\n**Tool Naming and Discoverability:**\nClear, descriptive tool names help agents find the right tools quickly. Use consistent prefixes (e.g., `github_create_issue`, `github_list_repos`) an","core":true},{"id":"mongodb","name":"mongodb","domain":"Data & ML","desc":"Administer MongoDB databases. Configure replica sets, sharding, and backups.","triggers":["mongodb","mongo","nosql","document store","bson","aggregation pipeline","mongodb atlas","pymongo","motor","mongoose"],"rules":[],"body":"# MongoDB\n\nAdminister, optimize, and secure MongoDB NoSQL databases in development and production environments.\n\n## When to Use\n\n- You need a document-oriented database with flexible schemas.\n- Your data is semi-structured or heavily nested (JSON-like documents).\n- You need horizontal scaling through sharding.\n- Your application benefits from rich querying and aggregation pipelines.\n\n## Prerequisites\n\n- Linux server (Debian/Ubuntu or RHEL-based) or Docker.\n- Root or sudo access for package installation.\n- Select a MongoDB release with verified current support and tool/OS compatibility; 6.x/7.x examples below are historical baselines.\n\n## Scope and data safety\n\nUse packages/repository codename matching the host OS and verify signing-key fingerprints independently. Bootstrap users only on a local/private isolated listener; restrict bindIp to the required private addresses, enable TLS and never expose unauthenticated initialization. Passwords/URIs below are placeholders: use prompts or protected tool configuration rather than real secrets in process arguments or committed Compose. The C","core":true},{"id":"nextjs","name":"nextjs","domain":"Backend","desc":"Next.js App Router — Server Components, Client Components, data fetching, caching, Server Actions, routing, layouts, middleware, and performance patterns.","triggers":["nextjs","next.js","app router","server component","client component","server action","use client","use server","next config","next middleware","route handler","next cache","revalidate"],"rules":["Default to Server Components — only add `'use client'` when you need interactivity","Colocate data fetching with the component that needs it (no prop drilling)","Use `loading.tsx` + `Suspense` for streaming — avoids blocking entire page","Server Actions over API routes for mutations from forms","`revalidateTag` over `revalidatePath` — more granular, less cache busting"],"body":"# Next.js App Router\n\n## Component model\n[code]\n\n## Data fetching\n[code]\n\n## Caching and revalidation\n[code]\n\n## Server Actions\n[code]\n\n## Routing\n[code]\n\n## Route Handlers\n[code]\n\n## Middleware\n[code]\n\n## Dynamic params\n[code]\n\n## Image and Font\n[code]\n\n## Rules\n- Default to Server Components — only add `'use client'` when you need interactivity\n- Colocate data fetching with the component that needs it (no prop drilling)\n- Use `loading.tsx` + `Suspense` for streaming — avoids blocking entire page\n- Server Actions over API routes for mutations from forms\n- `revalidateTag` over `revalidatePath` — more granular, less cache busting","core":true},{"id":"openai-sdk","name":"openai-sdk","domain":"LLM & AI","desc":"OpenAI API — chat completions, streaming, function calling, embeddings, assistants, vision, structured outputs, and async patterns using the Python SDK.","triggers":["openai","gpt","openai api","openai sdk","chatgpt api","gpt-4","gpt-4o","openai embeddings","openai function calling","openai assistants","openai structured output","tiktoken"],"rules":["Use `gpt-4o-mini` as default — 10× cheaper than `gpt-4o`, near-same quality for most tasks","Always set `max_tokens` to prevent runaway costs","Use `response_format={\"type\": \"json_object\"}` only when you don't have Pydantic schema","Prefer structured output (`beta.chat.completions.parse`) over JSON mode — no parsing errors","Retry on `RateLimitError` and `APIConnectionError` with exponential backoff"],"body":"# OpenAI API\n\n## Setup\n[code]\n\n## Basic chat\n[code]\n\n## Models (2026)\n| Model | Context | Best for |\n|---|---|---|\n| `gpt-4o` | 128k | General purpose, multimodal |\n| `gpt-4o-mini` | 128k | Fast, cheap, most tasks |\n| `o1` | 200k | Complex reasoning |\n| `o3-mini` | 200k | Reasoning, cheaper |\n| `text-embedding-3-small` | — | Embeddings (default) |\n| `text-embedding-3-large` | — | High-quality embeddings |\n\n## Streaming\n[code]\n\n## Function calling (tool use)\n[code]\n\n## Structured output (guaranteed JSON schema)\n[code]\n\n## Vision\n[code]\n\n## Embeddings\n[code]\n\n## Token counting (tiktoken)\n[code]\n\n## Rules\n- Use `gpt-4o-mini` as default — 10× cheaper than `gpt-4o`, near-same quality for most tasks\n- Always set `max_tokens` to prevent runaway costs\n- Use `response_format={\"type\": \"json_object\"}` only when you don't have Pydantic schema\n- Prefer structured output (`beta.chat.completions.parse`) over JSON mode — no parsing errors\n- Retry on `RateLimitError` and `APIConnectionError` with exponential backoff","core":true},{"id":"openbot","name":"OpenBot","domain":"Agents","desc":"Self-hostable workspace for AI coworkers (Bots). Each Bot gets a sandboxed Chromium container, shell access, and MCP tool integrations. Any AG-UI endpoint can be a Bot — LangGraph, Mastra, CrewAI, Pydantic AI, etc. Policy-gated (CEL) with full audit log.","triggers":["openbot","copilotkit openbot","ai coworker","ai workspace","ag-ui","browser automation agent","self-hosted ai agent","agentic workspace","openbot bot","copilotkit agent"],"rules":[],"body":"# OpenBot Skill\n\n## § RULES\n- OpenBot is an **application**, not an npm library — clone and self-host it; nothing is imported.\n- Always run inside WSL 2 on Windows (OpenBot's Chromium container layer requires Linux).\n- Policy rules (CEL) default to deny-before-allow and fail closed — write allow rules explicitly.\n- Never commit `KEY_ENCRYPTION_KEY`, model keys, or `BETTER_AUTH_SECRET` to the repo.\n- For agents you build, expose an AG-UI endpoint and register it at `/bots`; private addresses need `AGENT_ENDPOINT_ALLOWED_HOSTS`.\n\n---\n\n## Install and run (local dev)\n\n### Prerequisites\n- Docker + Docker Compose\n- Bun 1.4+\n- CopilotKit account (for the Intelligence service)\n- OpenAI or Anthropic API key\n\n[code]\n\n### Single container (Docker)\n[code]\n\n### Kubernetes (Helm)\n[code]\n\n---\n\n## Key environment variables\n\n[code]\n\nOAuth providers: `GOOGLE_OAUTH_CLIENT_ID`, `GOOGLE_OAUTH_CLIENT_SECRET`, Microsoft, Okta, SAML/OIDC.\n\n---\n\n## Bring your own agent (AG-UI)\n\nAny HTTP endpoint that speaks the [AG-UI protocol](https://github.com/ag-ui-protocol/ag-ui) can be a Bot.\n\n### LangGraph example\n[co","core":true},{"id":"pandas","name":"pandas","domain":"Data & ML","desc":"pandas & polars — data loading, cleaning, transformation, aggregation, merging, time series, and production data pipelines for data science and ML.","triggers":["pandas","polars","dataframe","csv","data cleaning","data wrangling","groupby","merge","pivot","time series","pd.read","iloc","loc","apply"],"rules":["Use `parquet` over CSV for ML pipelines (10x faster, typed)","Avoid `iterrows()` — use vectorized ops or `.apply()` only as last resort","`query()` is faster than boolean indexing for complex filters","Always `reset_index()` after groupby to avoid index confusion","For >5M rows: use polars or chunked pandas"],"body":"# pandas / polars\n\n## Setup\n[code]\n\n## Load data\n[code]\n\n## Inspect\n[code]\n\n## Clean\n[code]\n\n## Filter + select\n[code]\n\n## Transform\n[code]\n\n## Groupby + aggregate\n[code]\n\n## Merge / join\n[code]\n\n## Pivot / reshape\n[code]\n\n## Time series\n[code]\n\n## Polars (faster for >1M rows)\n[code]\n\n## Production patterns\n[code]\n\n## Rules\n- Use `parquet` over CSV for ML pipelines (10x faster, typed)\n- Avoid `iterrows()` — use vectorized ops or `.apply()` only as last resort\n- `query()` is faster than boolean indexing for complex filters\n- Always `reset_index()` after groupby to avoid index confusion\n- For >5M rows: use polars or chunked pandas","core":true},{"id":"postgres","name":"postgres","domain":"Data & ML","desc":"PostgreSQL — queries, indexes, EXPLAIN ANALYZE, window functions, CTEs, JSONB, full-text search, migrations, row-level security, and performance patterns.","triggers":["postgres","postgresql","psql","sql query","pg","explain analyze","cte","window function","jsonb","row level security","rls","pg index","sql performance"],"rules":["`EXPLAIN ANALYZE` before adding any index — measure first","`CREATE INDEX CONCURRENTLY` in production — never without it","`TIMESTAMPTZ` not `TIMESTAMP` — always store UTC","`UUID` PKs for public-facing IDs","`VACUUM ANALYZE` after bulk inserts/deletes"],"body":"# PostgreSQL\n\n## EXPLAIN ANALYZE (read this first for any slow query)\n[code]\n\n## Index patterns\n[code]\n\n## CTEs and Window Functions\n[code]\n\n## JSONB\n[code]\n\n## Full-Text Search\n[code]\n\n## Row-Level Security (multi-tenant)\n[code]\n\n## Useful queries\n[code]\n\n## Rules\n- `EXPLAIN ANALYZE` before adding any index — measure first\n- `CREATE INDEX CONCURRENTLY` in production — never without it\n- `TIMESTAMPTZ` not `TIMESTAMP` — always store UTC\n- `UUID` PKs for public-facing IDs\n- `VACUUM ANALYZE` after bulk inserts/deletes\n- Connection pooling: PgBouncer (transaction mode) in front of Postgres","core":true},{"id":"prompt-engineering","name":"prompt-engineering","domain":"LLM & AI","desc":"Expert guide on prompt engineering patterns, best practices, and optimization techniques. Use when user wants to improve prompts, learn prompting strategies, or debug agent behavior.","triggers":["prompt engineering","system prompt","few-shot","chain of thought","prompt optimization","prompt design","instruction tuning","prompt template"],"rules":[],"body":"# Prompt Engineering Patterns\n\nAdvanced prompt engineering techniques to maximize LLM performance, reliability, and controllability.\n\n## Core Capabilities\n\n### 1. Few-Shot Learning\n\nTeach the model by showing examples instead of explaining rules. Include 2-5 input-output pairs that demonstrate the desired behavior. Use when you need consistent formatting, specific reasoning patterns, or handling of edge cases. Additional examples may help or hurt; evaluate their relevance and token cost.\n\n**Example:**\n\n[code]\n\n### 2. Chain-of-Thought Prompting\n\nAsk for a concise rationale, assumptions, calculations or independently checkable evidence suitable for the task. Do not request hidden internal reasoning or assume a fixed percentage improvement; effects depend on model, task and evaluation.\n\n**Example:**\n\n[code]\n\n### 3. Prompt Optimization\n\nSystematically improve prompts through testing and refinement. Start simple, measure performance (accuracy, consistency, token usage), then iterate. Test on diverse inputs including edge cases. Use A/B testing to compare variations. Critical for productio","core":true},{"id":"pyrit","name":"PyRIT","domain":"Quality & Security","desc":"Microsoft's open-source AI red teaming toolkit for finding security and safety weaknesses in generative AI systems — automated scans, adaptive multi-turn attacks, a CLI scanner, a web GUI, and an extensible Python framework. Use when probing an LLM app for jailbreaks, prompt injection, harmful output, or before a model","triggers":["pyrit","ai red teaming","red team llm","jailbreak testing","prompt injection testing","adversarial testing","genai security","llm safety testing","harm testing","attack llm","pyrit_scan","copyrit"],"rules":[],"body":"# PyRIT Skill\n\n## § RULES\n- Red team only systems you are authorized to test. PyRIT generates real attack traffic against real endpoints.\n- Use `microsoft/PyRIT`. The old `Azure/PyRIT` repo is archived and read-only since March 2026.\n- Keep attack results in memory you control — transcripts contain the harmful outputs you just elicited.\n- Scan results are evidence, not a verdict. A clean automated scan does not mean the system is safe; pair it with human-led testing.\n- Pin the model and system prompt under test when comparing runs, or the scores mean nothing.\n\n---\n\n## Install\n\n[code]\n\nPython 3.11, 3.12, 3.13, or 3.14. The docs recommend 3.13 for local installs.\n\nVerify:\n\n[code]\n\n---\n\n## Configure\n\nCreate `~/.pyrit/.env`:\n\n[code]\n\nAnd `~/.pyrit/.pyrit_conf`:\n\n[code]\n\n---\n\n## Three ways to run it\n\n| Surface | Command | Use for |\n|---|---|---|\n| Scanner CLI | `pyrit_scan run airt.scam --target openai_chat` | repeatable automated scans |\n| Interactive shell | `pyrit_shell` | poking at a target by hand |\n| GUI (CoPyRIT) | `pyrit_backend`, then open `http://localhost:8000/` | human-led tes","core":true},{"id":"pytest","name":"pytest","domain":"Quality & Security","desc":"pytest — fixtures, parametrize, marks, conftest, monkeypatch, tmp_path, async tests, coverage, and common patterns for unit and integration testing.","triggers":["pytest","fixture","parametrize","conftest","monkeypatch","pytest mark","pytest async","test coverage","pytest plugin","hypothesis","factory boy"],"rules":["Real DB in integration tests — mocked DB tests miss migration bugs","`scope=\"session\"` for DB setup; `autouse` fixture for cleanup between tests","Use `tmp_path` for all file I/O in tests — never hardcode paths","`monkeypatch` over `unittest.mock.patch` — auto-reverts, no context manager needed","Name tests `test_<what>_<condition>_<expected>`: `test_login_wrong_password_returns_401`"],"body":"# pytest\n\n## Fixtures\n[code]\n\n## conftest.py\n[code]\n\n## Parametrize\n[code]\n\n## Marks\n[code]\n\n## Monkeypatch\n[code]\n\n## tmp_path and tmp_path_factory\n[code]\n\n## Async tests (pytest-asyncio)\n[code]\n\n## Useful CLI flags\n[code]\n\n## pyproject.toml config\n[code]\n\n## Rules\n- Real DB in integration tests — mocked DB tests miss migration bugs\n- `scope=\"session\"` for DB setup; `autouse` fixture for cleanup between tests\n- Use `tmp_path` for all file I/O in tests — never hardcode paths\n- `monkeypatch` over `unittest.mock.patch` — auto-reverts, no context manager needed\n- Name tests `test_<what>_<condition>_<expected>`: `test_login_wrong_password_returns_401`","core":true},{"id":"redis","name":"redis","domain":"Backend","desc":"Redis — caching, sessions, rate limiting, pub/sub, streams, distributed locks, leaderboards, and AI response caching patterns.","triggers":["redis","redis cache","redis stream","pub sub redis","redis rate limit","redis lock","redis session","cache layer","in-memory store"],"rules":["Always set TTL — unbounded keys = memo ehensive guide to using Meta's AudioCraft for text-to-music and text-to-audio generation with MusicGen, AudioGen, and EnCodec.\n\n## When to use AudioCraft\n\n**Use AudioCraft when:**\n- Need to generate music from text descriptions\n- Creating sound effects and environmental audio\n- Building music generation applications\n- Need melody-conditioned music generation\n- Want stereo audio output\n- Require controllable music generation with style transfer\n\n**Key features","core":false},{"id":"blip-2","name":"blip-2-vision-language","domain":"Research","parent":"research-18-multimodal","desc":"Vision-language pre-training framework bridging frozen image encoders and LLMs. Use when you need image captioning, visual question answering, image-text retrieval, or multimodal chat with state-of-the-art zero-shot performance.","triggers":[],"rules":[],"body":"# BLIP-2: Vision-Language Pre-training\n\nComprehensive guide to using Salesforce's BLIP-2 for vision-language tasks with frozen image encoders and large language models.\n\n## When to use BLIP-2\n\n**Use BLIP-2 when:**\n- Need high-quality image captioning with natural descriptions\n- Building visual question answering (VQA) systems\n- Require zero-shot image-text understanding without task-specific training\n- Want to leverage LLM reasoning for visual tasks\n- Building multimodal conversational AI\n- Need","core":false},{"id":"clip","name":"clip","domain":"Research","parent":"research-18-multimodal","desc":"OpenAI's model connecting vision and language. Enables zero-shot image classification, image-text matching, and cross-modal retrieval. Trained on 400M image-text pairs. Use for image search, content moderation, or vision-language tasks without fine-tuning. Bes","triggers":[],"rules":[],"body":"# CLIP - Contrastive Language-Image Pre-Training\n\nOpenAI's model that understands images from natural language.\n\n## When to use CLIP\n\n**Use when:**\n- Zero-shot image classification (no training data needed)\n- Image-text similarity/matching\n- Semantic image search\n- Content moderation (detect NSFW, violence)\n- Visual question answering\n- Cross-modal retrieval (image→text, text→image)\n\n**Metrics**:\n- **25,300+ GitHub stars**\n- Trained on 400M image-text pairs\n- Matches ResNet-50 on ImageNet (zero-","core":false},{"id":"llava","name":"llava","domain":"Research","parent":"research-18-multimodal","desc":"Large Language and Vision Assistant. Enables visual instruction tuning and image-based conversations. Combines CLIP vision encoder with Vicuna/LLaMA language models. Supports multi-turn image chat, visual question answering, and instruction following. Use for ","triggers":[],"rules":[],"body":"# LLaVA - Large Language and Vision Assistant\n\nOpen-source vision-language model for conversational image understanding.\n\n## When to use LLaVA\n\n**Use when:**\n- Building vision-language chatbots\n- Visual question answering (VQA)\n- Image description and captioning\n- Multi-turn image conversations\n- Visual instruction following\n- Document understanding with images\n\n**Metrics**:\n- **23,000+ GitHub stars**\n- GPT-4V level capabilities (targeted)\n- Apache 2.0 License\n- Multiple model sizes (7B-34B para","core":false},{"id":"segment-anything","name":"segment-anything-model","domain":"Research","parent":"research-18-multimodal","desc":"Foundation model for image segmentation with zero-shot transfer. Use when you need to segment any object in images using points, boxes, or masks as prompts, or automatically generate all object masks in an image.","triggers":[],"rules":[],"body":"# Segment Anything Model (SAM)\n\nComprehensive guide to using Meta AI's Segment Anything Model for zero-shot image segmentation.\n\n## When to use SAM\n\n**Use SAM when:**\n- Need to segment any object in images without task-specific training\n- Building interactive annotation tools with point/box prompts\n- Generating training data for other vision models\n- Need zero-shot transfer to new image domains\n- Building object detection/segmentation pipelines\n- Processing medical, satellite, or domain-specific","core":false},{"id":"stable-diffusion","name":"stable-diffusion-image-generation","domain":"Research","parent":"research-18-multimodal","desc":"State-of-the-art text-to-image generation with Stable Diffusion models via HuggingFace Diffusers. Use when generating images from text prompts, performing image-to-image translation, inpainting, or building custom diffusion pipelines.","triggers":[],"rules":[],"body":"# Stable Diffusion Image Generation\n\nComprehensive guide to generating images with Stable Diffusion using the HuggingFace Diffusers library.\n\n## When to use Stable Diffusion\n\n**Use Stable Diffusion when:**\n- Generating images from text descriptions\n- Performing image-to-image translation (style transfer, enhancement)\n- Inpainting (filling in masked regions)\n- Outpainting (extending images beyond boundaries)\n- Creating variations of existing images\n- Building custom image generation workflows\n\n**","core":false},{"id":"whisper","name":"whisper","domain":"Research","parent":"research-18-multimodal","desc":"OpenAI's general-purpose speech recognition model. Supports 99 languages, transcription, translation to English, and language identification. Six model sizes from tiny (39M params) to large (1550M params). Use for speech-to-text, podcast transcription, or mult","triggers":[],"rules":[],"body":"# Whisper - Robust Speech Recognition\n\nOpenAI's multilingual speech recognition model.\n\n## When to use Whisper\n\n**Use when:**\n- Speech-to-text transcription (99 languages)\n- Podcast/video transcription\n- Meeting notes automation\n- Translation to English\n- Noisy audio transcription\n- Multilingual audio processing\n\n**Metrics**:\n- **72,900+ GitHub stars**\n- 99 languages supported\n- Trained on 680,000 hours of audio\n- MIT License\n\n**Use alternatives instead**:\n- **AssemblyAI**: Managed API, speaker ","core":false},{"id":"research-19-emerging-techniques","name":"research-19-emerging-techniques","domain":"Research","desc":"Emerging techniques — speculative decoding, knowledge distillation, model merging, MoE, long context.","triggers":["speculative decoding","knowledge distillation","model merging","pruning","moe","mixture of experts","long context","emerging techniques"],"rules":[],"body":"# research-19-emerging-techniques\n\nSub-skills: knowledge-distillation, long-context, model-merging, model-pruning, moe-training, speculative-decoding\n\nUse /research-19-emerging-techniques to load research context for this topic area.\nEach sub-skill covers a specific library or framework — see SKILL.md files within subdirectories.","core":true},{"id":"knowledge-distillation","name":"knowledge-distillation","domain":"Research","parent":"research-19-emerging-techniques","desc":"Compress large language models using knowledge distillation from teacher to student models. Use when deploying smaller models with retained performance, transferring GPT-4 capabilities to open-source models, or reducing inference costs. Covers temperature scal","triggers":[],"rules":[],"body":"# Knowledge Distillation: Compressing LLMs\n\n## When to Use This Skill\n\nUse Knowledge Distillation when you need to:\n- **Compress models** from 70B → 7B while retaining 90%+ performance\n- **Transfer capabilities** from proprietary models (GPT-4) to open-source (LLaMA, Mistral)\n- **Reduce inference costs** by deploying smaller student models\n- **Create specialized models** by distilling domain-specific knowledge\n- **Improve small models** using synthetic data from large teachers\n\n**Key Techniques*","core":false},{"id":"long-context","name":"long-context","domain":"Research","parent":"research-19-emerging-techniques","desc":"Extend context windows of transformer models using RoPE, YaRN, ALiBi, and position interpolation techniques. Use when processing long documents (32k-128k+ tokens), extending pre-trained models beyond original context limits, or implementing efficient positiona","triggers":[],"rules":[],"body":"# Long Context: Extending Transformer Context Windows\n\n## When to Use This Skill\n\nUse Long Context techniques when you need to:\n- **Process long documents** (32k, 64k, 128k+ tokens) with transformer models\n- **Extend context windows** of pre-trained models (LLaMA, Mistral, etc.)\n- **Implement efficient positional encodings** (RoPE, ALiBi)\n- **Train models** with length extrapolation capabilities\n- **Deploy models** that handle variable-length inputs efficiently\n- **Fine-tune** existing models fo","core":false},{"id":"model-merging","name":"model-merging","domain":"Research","parent":"research-19-emerging-techniques","desc":"Merge multiple fine-tuned models using mergekit to combine capabilities without retraining. Use when creating specialized models by blending domain-specific expertise (math + coding + chat), improving performance beyond single models, or experimenting rapidly ","triggers":[],"rules":[],"body":"# Model Merging: Combining Pre-trained Models\n\n## When to Use This Skill\n\nUse Model Merging when you need to:\n- **Combine capabilities** from multiple fine-tuned models without retraining\n- **Create specialized models** by blending domain-specific expertise (math + coding + chat)\n- **Improve performance** beyond single models (often +5-10% on benchmarks)\n- **Reduce training costs** - no GPUs needed, merges run on CPU\n- **Experiment rapidly** - create new model variants in minutes, not days\n- **P","core":false},{"id":"model-pruning","name":"model-pruning","domain":"Research","parent":"research-19-emerging-techniques","desc":"Reduce LLM size and accelerate inference using pruning techniques like Wanda and SparseGPT. Use when compressing models without retraining, achieving 50% sparsity with minimal accuracy loss, or enabling faster inference on hardware accelerators. Covers unstruc","triggers":[],"rules":[],"body":"# Model Pruning: Compressing LLMs\n\n## When to Use This Skill\n\nUse Model Pruning when you need to:\n- **Reduce model size** by 40-60% with <1% accuracy loss\n- **Accelerate inference** using hardware-friendly sparsity (2-4× speedup)\n- **Deploy on constrained hardware** (mobile, edge devices)\n- **Compress without retraining** using one-shot methods\n- **Enable efficient serving** with reduced memory footprint\n\n**Key Techniques**: Wanda (weights × activations), SparseGPT (second-order), structured pru","core":false},{"id":"moe-training","name":"moe-training","domain":"Research","parent":"research-19-emerging-techniques","desc":"Train Mixture of Experts (MoE) models using DeepSpeed or HuggingFace. Use when training large-scale models with limited compute (5× cost reduction vs dense models), implementing sparse architectures like Mixtral 8x7B or DeepSeek-V3, or scaling model capacity w","triggers":[],"rules":[],"body":"# MoE Training: Mixture of Experts\n\n## When to Use This Skill\n\nUse MoE Training when you need to:\n- **Train larger models** with limited compute (5× cost reduction vs dense models)\n- **Scale model capacity** without proportional compute increase\n- **Achieve better performance** per compute budget than dense models\n- **Specialize experts** for different domains/tasks/languages\n- **Reduce inference latency** with sparse activation (only 13B/47B params active in Mixtral)\n- **Implement SOTA models**","core":false},{"id":"speculative-decoding","name":"speculative-decoding","domain":"Research","parent":"research-19-emerging-techniques","desc":"Accelerate LLM inference using speculative decoding, Medusa multiple heads, and lookahead decoding techniques. Use when optimizing inference speed (1.5-3.6× speedup), reducing latency for real-time applications, or deploying models with limited compute. Covers","triggers":[],"rules":[],"body":"# Speculative Decoding: Accelerating LLM Inference\n\n## When to Use This Skill\n\nUse Speculative Decoding when you need to:\n- **Speed up inference** by 1.5-3.6× without quality loss\n- **Reduce latency** for real-time applications (chatbots, code generation)\n- **Optimize throughput** for high-volume serving\n- **Deploy efficiently** on limited hardware\n- **Generate faster** without changing model architecture\n\n**Key Techniques**: Draft model speculative decoding, Medusa (multiple heads), Lookahead D","core":false},{"id":"research-20-ml-paper-writing","name":"research-20-ml-paper-writing","domain":"Research","desc":"ML paper writing — structure, related work, ablation, academic conventions for arxiv/NeurIPS/ICML.","triggers":["ml paper","research paper","paper writing","arxiv","paper structure","related work","ablation study","academic writing"],"rules":[],"body":"# research-20-ml-paper-writing\n\nSub-skills: references, templates\n\nUse /research-20-ml-paper-writing to load research context for this topic area.\nEach sub-skill covers a specific library or framework — see SKILL.md files within subdirectories.","core":true},{"id":"research-21-extras","name":"research-21-extras","domain":"Research","desc":"Research workflow extras - autoresearch, idea generation, ML training recipes, paper writing and talks, plotting, robotics policies (openpi, openvla-oft, cosmos-policy).","triggers":["autoresearch","research ideas","brainstorming research","training recipes","paper writing","conference talk","academic plotting","experiment tracking","swanlab","openvla","openpi","cosmos policy","agent evolution"],"rules":[],"body":"# research-21-extras\n\nSub-skills: 0-autoresearch-skill, a-evolve, academic-plotting, agent-framework-azure-ai-py, brainstorming-research-ideas, cosmos-policy, creative-thinking-for-research, find-skills, ml-paper-writing, ml-training-recipes, openpi, openvla-oft, presenting-conference-talks, swanlab, systems-paper-writing\n\nEach sub-skill has its own SKILL.md in its subdirectory.","core":true},{"id":"0-autoresearch-skill","name":"autoresearch","domain":"Research","parent":"research-21-extras","desc":"Orches

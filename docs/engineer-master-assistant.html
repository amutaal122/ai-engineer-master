s to generate architecture diagrams via Gemini. Given experiment results or data, auto-selects chart typ","triggers":[],"rules":[],"body":"# Academic Plotting for ML Papers\n\nGenerate publication-quality figures for ML/AI conference papers. Two distinct workflows:\n\n1. **Diagram figures** (architecture, system design, workflows, pipelines) — AI image generation via Gemini\n2. **Data figures** (line charts, bar charts, scatter plots, heatmaps, ablations) — matplotlib/seaborn\n\n## When to Use Which Workflow\n\n| Figure Type | Tool | Why |\n|-------------|------|-----|\n| Architecture / system diagram | Gemini (Workflow 1) | Complex spatial l","core":false},{"id":"agent-framework-azure-ai-py","name":"agent-framework-azure-ai-py","domain":"Research","parent":"research-21-extras","desc":"Build persistent agents on Azure AI Foundry using the Microsoft Agent Framework Python SDK.","triggers":[],"rules":[],"body":"## Bundled upstream support\n\nSupporting files are included at skill-relative paths. See [UPSTREAM-NOTICE.md](UPSTREAM-NOTICE.md) for their pinned sources, licenses, hashes, and import changes.\n\n# Agent Framework Azure Hosted Agents\n\nBuild persistent agents on Azure AI Foundry using the Microsoft Agent Framework Python SDK.\n\n## Architecture\n\n[code]\n\n## SDK generation and execution scope\n\nThe examples below preserve an older Agent Framework generation (`AzureAIAgentsProvider`, `AgentThread`, `Host","core":false},{"id":"brainstorming-research-ideas","name":"brainstorming-research-ideas","domain":"Research","parent":"research-21-extras","desc":"Guides researchers through structured ideation frameworks to discover high-impact research directions. Use when exploring new problem spaces, pivoting between projects, or seeking novel angles on existing work.","triggers":[],"rules":[],"body":"# Research Idea Brainstorming\n\nStructured frameworks for discovering the next research idea. This skill provides ten complementary ideation lenses that help researchers move from vague curiosity to concrete, defensible research proposals. Each framework targets a different cognitive mode—use them individually or combine them for comprehensive exploration.\n\n## When to Use This Skill\n\n- Starting a new research direction and need structured exploration\n- Feeling stuck on a current project and want ","core":false},{"id":"cosmos-policy","name":"evaluating-cosmos-policy","domain":"Research","parent":"research-21-extras","desc":"Evaluates NVIDIA Cosmos Policy on LIBERO and RoboCasa simulation environments. Use when setting up cosmos-policy for robot manipulation evaluation, running headless GPU evaluations with EGL rendering, or profiling inference latency on cluster or local GPU mach","triggers":[],"rules":[],"body":"# Cosmos Policy Evaluation\n\nEvaluation workflows for NVIDIA Cosmos Policy on LIBERO and RoboCasa simulation environments from the public `cosmos-policy` repository. Covers blank-machine setup, headless GPU evaluation, and inference profiling.\n\n## Quick start\n\nRun a minimal LIBERO evaluation using the official public eval module:\n\n[code]\n\n## Core concepts\n\n**What Cosmos Policy is**: NVIDIA Cosmos Policy is a vision-language-action (VLA) model that uses Cosmos Tokenizer to encode visual observatio","core":false},{"id":"creative-thinking-for-research","name":"creative-thinking-for-research","domain":"Research","parent":"research-21-extras","desc":"Applies cognitive science frameworks for creative thinking to CS and AI research ideation. Use when seeking genuinely novel research directions by leveraging combinatorial creativity, analogical reasoning, constraint manipulation, and other empirically grounde","triggers":[],"rules":[],"body":"# Creative Thinking for Research\n\nEight empirically grounded frameworks from cognitive science, applied to computer science and AI research. Unlike ad-hoc brainstorming, each framework here is backed by decades of creativity research — from Koestler's bisociation to Kauffman's adjacent possible. They target distinct cognitive operations: combining, reformulating, analogizing, constraining, inverting, abstracting, exploring boundaries, and holding contradictions.\n\n## When to Use This Skill\n\n- Gen","core":false},{"id":"find-skills","name":"find-skills","domain":"Research","parent":"research-21-extras","desc":"Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionalit","triggers":[],"rules":[],"body":"# Find Skills\n\nThis skill helps you discover and install skills from the open agent skills ecosystem.\n\n## When to Use This Skill\n\nUse this skill when the user:\n\n- Asks \"how do I do X\" where X might be a common task with an existing skill\n- Says \"find a skill for X\" or \"is there a skill for X\"\n- Asks \"can you do X\" where X is a specialized capability\n- Expresses interest in extending agent capabilities\n- Wants to search for tools, templates, or workflows\n- Mentions they wish they had help with a ","core":false},{"id":"ml-paper-writing","name":"ml-paper-writing","domain":"Research","parent":"research-21-extras","desc":"Write publication-ready ML/AI papers for NeurIPS, ICML, ICLR, ACL, AAAI, COLM. Use when drafting papers from research repos, structuring arguments, verifying citations, or preparing camera-ready submissions. For systems venues (OSDI, NSDI, ASPLOS, SOSP), use s","triggers":[],"rules":[],"body":"# ML Paper Writing for Top AI Conferences\n\nExpert-level guidance for writing publication-ready papers targeting **NeurIPS, ICML, ICLR, ACL, AAAI, COLM**. This skill combines writing philosophy from top researchers (Nanda, Farquhar, Karpathy, Lipton, Steinhardt) with practical tools: LaTeX templates, citation verification APIs, and conference checklists.\n\n**For systems venues (OSDI, NSDI, ASPLOS, SOSP)**, us ng oral/spotlight/poster-talk slides | ✅ | |\n| Generating Beam","core":false},{"id":"swanlab","name":"experiment-tracking-swanlab","domain":"Research","parent":"research-21-extras","desc":"Provides guidance for experiment tracking with SwanLab. Use when you need open-source run tracking, local or self-hosted dashboards, and lightweight media logging for ML workflows.","triggers":[],"rules":[],"body":"# SwanLab: Open-Source Experiment Tracking\n\n## When to Use This Skill\n\nUse SwanLab when you need to:\n- **Track ML experiments** with metrics, configs, tags, and descriptions\n- **Visualize training** with scalar charts and logged media\n- **Compare runs** across seeds, checkpoints, and hyperparameters\n- **Work locally or self-hosted** instead of depending on managed SaaS\n- **Integrate** with PyTorch, Transformers, PyTorch Lightning, or Fastai\n\n**Deployment**: Cloud, local, or self-hosted | **Media","core":false},{"id":"systems-paper-writing","name":"systems-paper-writing","domain":"Research","parent":"research-21-extras","desc":"Comprehensive guide for writing systems papers targeting OSDI, SOSP, ASPLOS, NSDI, and EuroSys. Provides paragraph-level structural blueprints, writing patterns, venue-specific checklists, reviewer guidelines, LaTeX templates, and conference deadlines. Use thi","triggers":[],"rules":[],"body":"# Systems Paper Writing: Paragraph-Level Structural Blueprint\n\nFine-grained structural guidance for writing **10–12 page systems papers** targeting top systems venues: OSDI, SOSP, ASPLOS, NSDI, and EuroSys. This skill provides page allocation per section, paragraph-level blueprints, and writing patterns distilled from authoritative guides and best-paper analysis.\n\n## When to Use This Skill\n\n| Scenario | Use This Skill | Use ml-paper-writing Instead |\n|----------|---------------|-----------------","core":false},{"id":"ruflo","name":"Ruflo","domain":"Agents","desc":"An agent meta-harness for Claude Code and Codex — 100+ agents, swarm coordination, self-learning memory, vector RAG, federation across machines, a TUI, and 48 Claude Code plugins. Use when orchestrating many agents, sharing memory between them, or running coordinated work across more than one machine.","triggers":["ruflo","claude-flow","agent swarm","multi agent orchestration","agent harness","agent federation","swarm coordination","agent memory","100 agents","npx ruflo"],"rules":[],"body":"# Ruflo Skill\n\n## § RULES\n- **Review mods before installing.** They run with your account's permissions — a mod is code, not config.\n- Network, spending, and destructive actions require confirmation even under `auto` approval. Do not configure that away.\n- Start at the lowest console permission that works: `read` → `write` → `manage` → `full`.\n- Federation opens a machine to remote coordination. Only join endpoints you control or trust.\n- Self-learning quality tracks the memory and feedback you configure. Bad feedback produces confidently wrong agents.\n\n---\n\n## Install\n\n[code]\n\nGlobal:\n\n[code]\n\nPOSIX one-liner:\n\n[code]\n\nClaude Code plugins (needs Claude Code **2.1.287+**):\n\n[code]\n\n---\n\n## MCP\n\n[code]\n\nOther clients: command `npx`, args `[\"-y\", \"ruflo@latest\", \"mcp\", \"start\"]`.\n\n---\n\n## CLI\n\n[code]\n\n`init --grok` is also mentioned.\n\n---\n\n## Permission model\n\n| Level | Grants |\n|---|---|\n| `read` | observe only |\n| `write` | modify files |\n| `manage` | control agents and tasks |\n| `full` | everything |\n\nApproval is `ask` or `auto`. Even `auto` still gates network, spending, and destru","core":true},{"id":"scikit-learn","name":"scikit-learn","domain":"Data & ML","desc":"scikit-learn — ML pipelines, preprocessing, classification, regression, clustering, model selection, evaluation, and production patterns for data scientists.","triggers":["scikit-learn","sklearn","machine learning","classifier","regressor","pipeline","cross_val","GridSearchCV","RandomForest","XGBoost","model training","feature engineering","preprocessing"],"rules":["Always use `Pipeline` — never fit preprocessor on full dataset (data leakage)","Use `StratifiedKFold` for classification (preserves class balance)","`RandomizedSearchCV` over `GridSearchCV` for >3 hyperparameters","Save with `joblib` not `pickle` (handles numpy arrays better)","Set `random_state=42` everywhere for reproducibility"],"body":"# scikit-learn\n\n## Pipeline (always use — prevents data leakage)\n[code]\n\n## Model selection\n| Task | Algorithm | When |\n|---|---|---|\n| Classification | `LogisticRegression` | Baseline, interpretable |\n| Classification | `RandomForestClassifier` | Tabular, feature importance |\n| Classification | `GradientBoostingClassifier` | Best accuracy on tabular |\n| Regression | `Ridge` / `Lasso` | Linear + regularization |\n| Regression | `RandomForestRegressor` | Non-linear tabular |\n| Clustering | `KMeans` | Known k, spherical clusters |\n| Clustering | `DBSCAN` | Unknown k, noise |\n| Dimensionality | `PCA` | Linear reduction |\n| Dimensionality | `UMAP` (umap-learn) | Non-linear, visualization |\n\n## Cross-validation + evaluation\n[code]\n\n## Hyperparameter tuning\n[code]\n\n## Preprocessing patterns\n[code]\n\n## Class imbalance\n[code]\n\n## Save + load model\n[code]\n\n## Feature importance\n[code]\n\n## Rules\n- Always use `Pipeline` — never fit preprocessor on full dataset (data leakage)\n- Use `StratifiedKFold` for classification (preserves class balance)\n- `RandomizedSearchCV` over `GridSearchCV` for >3 hyp","core":true},{"id":"scrapling","name":"Scrapling","domain":"Data & ML","desc":"Python web scraping framework built for AI agents — fast HTTP fetchers with TLS fingerprint impersonation, stealth browsers that solve Cloudflare, CSS/XPath/BeautifulSoup-style parsing, Scrapy-like spiders, a CLI, and an MCP server. Use for data acquisition, crawling, and letting an agent extract from live pages.","triggers":["scrapling","web scraping","scrape a website","crawler","spider","beautifulsoup alternative","scrapy alternative","cloudflare bypass","stealth browser","extract data from website","html parsing","mcp scraping"],"rules":[],"body":"# Scrapling Skill\n\n## § RULES\n- Respect `robots.txt` and the site's terms of service. The project itself states it is for educational and research purposes.\n- Reach for `Fetcher` (plain HTTP) first. Only escalate to `StealthyFetcher` when the page needs JS rendering or is behind anti-bot — browsers are orders of magnitude slower.\n- `pip install scrapling` gives you the **parser only**. Importing `scrapling.fetchers` or `scrapling.spiders` without the extra raises `ModuleNotFoundError`.\n- Run `scrapling install` after installing the fetchers extra, or no browser is on disk.\n- Rate-limit and cache. A spider that hammers a site is a bug, not a feature.\n\n---\n\n## Install\n\n[code]\n\nOther extras:\n\n| Extra | Adds |\n|---|---|\n| `scrapling[ai]` | MCP server |\n| `scrapling[shell]` | interactive shell and `extract` CLI |\n| `scrapling[rag]` | RAG helpers |\n| `scrapling[all]` | everything |\n\nPython 3.10+. Docker image: `docker pull pyd4vinci/scrapling`.\n\n---\n\n## Fetchers — pick the cheapest that works\n\n| Class | What it does | Use when |\n|---|---|---|\n| `Fetcher` | fast, stealthy HTTP request | sta","core":true},{"id":"security-audit","name":"security-audit","domain":"Quality & Security","desc":"Comprehensive security auditing workflow covering web application testing, API security, penetration testing, vulnerability scanning, and security hardening.","triggers":["security audit","penetration testing","vulnerability","owasp","xss","sql injection","csrf","auth bypass","threat model"],"rules":[],"body":"# Security Auditing Workflow Bundle\n\n> **⚠️ AUTHORIZED USE ONLY**\n> This skill is for educational purposes or authorized security assessments only.\n> You must have explicit, written permission from the system owner before using this tool.\n> Misuse of this tool is illegal and strictly prohibited.\n\n## Mandatory confirmation gate\n\nBefore each active security action, state the exact target URL, IP, account, or resource, the written-authorization confirmation, permitted scope, exact command, expected effect and limits. Without confirmation, remain read-only and provide defensive guidance only. Wait for explicit confirmation in the current conversation before executing it. Existing scope does not authorize expanding targets or techniques.\n\n## Overview\n\nComprehensive security auditing workflow for web applications, APIs, and infrastructure. This bundle orchestrates skills for penetration testing, vulnerability assessment, security scanning, and remediation.\n\n## When to Use This Workflow\n\nUse this workflow when:\n- Performing security audits on web applications\n- Testing API security\n- Conduc","core":true},{"id":"skillspector","name":"SkillSpector","domain":"Agents","desc":"NVIDIA's security scanner for agent skills (Claude Code, Codex, MCP servers). Combines static analysis, YARA rules, OSV.dev CVE lookups, and optional LLM review to flag prompt injection, data exfiltration, and supply-chain risk — without executing the skill.","triggers":["skillspector","skill security","agent skill scanner","skill audit","mcp security scanner","prompt injection scan","skill inspector","agent security audit","nvidia skillspector"],"rules":[],"body":"# SkillSpector Skill\n\n## § RULES\n- Always run `skillspector scan` before installing any third-party skill or MCP server.\n- Use `--no-llm` in CI — it's faster and deterministic.\n- Use `--format sarif` to integrate scan results with GitHub Code Scanning.\n- Review baseline files regularly; a stale baseline masks new risks.\n- Never suppress findings without understanding them.\n\n---\n\n## Install\n\n[code]\n\nRequires Python 3.12 or 3.13. Python 3.14+ may need YARA built from source.\n\n---\n\n## Scan a skill directory\n\n[code]\n\n### LLM provider options\n| `SKILLSPECTOR_PROVIDER` | Key env var |\n|---|---|\n| `openai` | `OPENAI_API_KEY` |\n| `anthropic` | `ANTHROPIC_API_KEY` |\n| `nvidia` | `NVIDIA_API_KEY` |\n\n---\n\n## Baseline management\n\n[code]\n\n---\n\n## MCP server mode\n\n[code]\n\nMCP config:\n[code]\n\n---\n\n## Python API\n\n[code]\n\n---\n\n## CI/CD integration (GitHub Actions)\n\n[code]\n\n---\n\n## What it checks\n- **Prompt injection** — instructions hidden in skill files that hijack agent behavior\n- **Data exfiltration** — covert channels, unexpected network calls\n- **Supply-chain risk** — dependency CVEs via OSV.dev","core":true},{"id":"sqlalchemy","name":"sqlalchemy","domain":"Backend","desc":"SQLAlchemy 2.x — async ORM, models, relationships, sessions, queries, migrations with Alembic, connection pooling, and production patterns.","triggers":["sqlalchemy","sqlalchemy orm","alembic","async sqlalchemy","sqlalchemy model","sqlalchemy query","sqlalchemy session","sqlalchemy relationship","database orm","python orm"],"rules":["`expire_on_commit=False` — required for async sessions (avoids greenlet errors)","`pool_pre_ping=True` — reconnects after DB restart without errors","`lazy=\"selectin\"` for async relationships — `lazy=\"subquery\"` causes errors in async","Always use `select()` not `session.query()` — 2.x style only","Use `mapped_column()` with `Mapped[type]` annotations — fully type-safe"],"body":"# SQLAlchemy 2.x\n\n## Setup (async)\n[code]\n\n[code]\n\n## Models\n[code]\n\n## Session (FastAPI dependency)\n[code]\n\n## Queries (SQLAlchemy 2.x style)\n[code]\n\n## Relationships — loading strategies\n[code]\n\n## Alembic migrations\n[code]\n\n## Rules\n- `expire_on_commit=False` — required for async sessions (avoids greenlet errors)\n- `pool_pre_ping=True` — reconnects after DB restart without errors\n- `lazy=\"selectin\"` for async relationships — `lazy=\"subquery\"` causes errors in async\n- Always use `select()` not `session.query()` — 2.x style only\n- Use `mapped_column()` with `Mapped[type]` annotations — fully type-safe\n- One session per ; both themes defined; body sets explicit background.\n\n## §TYPE\n| Role | Size / weight | Use |\n|---|---|---|\n| Display | 32-48 / 700 | one hero line only |\n| H1-H2 | 24-28 / 600 | page, section |\n| Body | 14-16 / 400, line-height 1.5 | text, max 65ch wide |\n| Label | 12 / 500, +0.04em, uppercase | eyebrows, table heads |\n| Mono | 13 | code, ids, numbers in tables (`tabular-nums`) |\n\nTwo families max. Scale: 12, 14, 16, 20, 24, 32, 48.\n\n## §LAYOUT\n- 8px spacing grid; use `gap`, not margins between siblings.\n- Content width 1100-1200px; reading width 65ch; side gutter >= 16px.\n- Summary before detail.","core":true},{"id":"ui-skills","name":"UI Skills","domain":"UI & Apps","desc":"A registry of design-engineering skills from ibelick, reachable through an npx CLI or a hosted MCP endpoint, plus a playbook of distilled UI craft lessons. Use to pull a focused skill such as baseline-ui or a motion skill into a project without installing a whole pack.","triggers":["ui-skills","design engineer","baseline ui","motion skill","ui playbook","ui craft","design engineering","npx ui-skills","ui skills mcp","fetch a ui skill"],"rules":[],"body":"# UI Skills Skill\n\n## § RULES\n- Browse before you fetch — `categories` then `list` costs nothing and avoids pulling the wrong skill.\n- Fetch one skill at a time. The point of this registry is a small focused drop-in, not a bulk install.\n- The registry is remote and changes; re-run `list` rather than trusting a cached skill name.\n- Read a skill before applying it. These are opinions about craft, not neutral config.\n\n---\n\n## Use it\n\nNo install step — everything runs through `npx`:\n\n[code]\n\n---\n\n## MCP endpoint\n\n[code]\n\nTools: `list_skills`, `get_skill`.\n\nWire it up so the agent can pull a skill mid-task instead of you fetching by hand:\n\n[code]\n\n---\n\n## Playbook\n\nDistilled UI lessons live at `ui-skills.com/playbook` — short, specific craft notes rather than a framework. Worth reading end to end onc /* ---------- retrieval ---------- */
const STOP=new Set('a an the and or of to for in on with is are be how do does i we you my me what which should can use using need want build make create project app that this it as at by from some any get give tell about into your our would like please help'.split(' '));
const stem=w=>w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w;
const tok=s=>(String(s).toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)).map(stem);
const counts=a=>{const m={};a.forEach(w=>m[w]=(m[w]||0)+1);return m};
const IDX=KB.skills.map(s=>({s,f:{name:counts(tok(s.id.replace(/^research-\d+-/,'')+' '+s.id)),trig:counts(tok(s.triggers.join(' '))),desc:counts(tok(s.desc)),dom:counts(tok(s.domain)),body:counts(tok((s.rules||[]).join(' ')+' '+s.body))}}));
const W={name:5,trig:3,desc:1.5,dom:1,body:.4};
const DF={};IDX.forEach(d=>{const seen=new Set();Object.values(d.f).forEach(f=>Object.keys(f).forEach(k=>seen.add(k)));seen.forEach(k=>DF[k]=(DF[k]||0)+1)});
const idf=w=>Math.log(1+IDX.length/((DF[w]||0)+.5));
const metaStrip=q=>q.replace(/\b(which|what)\s+(skills?|agents?)(\s+and\s+(skills?|agents?))?/gi,' ').replace(/\b(skills?|agents?)\s+(and\s+(skills?|agents?)\s+)?(should|do|to use|can)\b/gi,' ');
const keepTop=r=>r.length?r.filter(x=>x.score>=r[0].score*.35):r;
function search(q,k=8,coreOnly=true){
  q=metaStrip(q);
  const qt=[...new Set(tok(q))],ql=' '+q.toLowerCase()+' ';
  if(!qt.length)return[];
  const out=[];
  for(const d of IDX){
    if(coreOnly&&!d.s.core)continue;
    if(d.s.id==='ai-engineer-master'&&!ql.includes('ai-engineer-master'))continue;
    let sc=0;
    for(const w of qt){let t=0;for(const f in W){const c=d.f[f][w];if(c)t+=W[f]*(1+Math.log(c))}sc+=idf(w)*t}
    if(ql.includes(' '+d.s.id+' ')||ql.includes('/'+d.s.id))sc+=14;
    for(const tr of d.s.triggers){if(tr.length>3&&ql.includes(' '+tr.toLowerCase()+' '))sc+=3}
    if(!d.s.core)sc*=.75;
    if(sc>0)out.push({s:d.s,score:sc})
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,k);
}
function matchedWhy(s,q){
  const qt=new Set(tok(q)),hit=[];
  for(const t of s.triggers){const tt=tok(t);if(tt.length&&tt.every(w=>qt.has(w))||tt.some(w=>qt.has(w)&&w.length>3)){hit.push(t)}}
  return hit.slice(0,3);
}
const phasesOf=id=>PH.map((p,i)=>p.skills.includes(id)?i:-1).filter(i=>i>=0);
const short=(t,n=150)=>{t=String(t).replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1).replace(/\s+\S*$/,'')+'...':t};
const sk=id=>'`/'+id+'`';
const roleMd=r=>agentById[r]?'`'+r+'`':'*'+r+'*';

/* ---------- offline expert ---------- */
function recommend(q){
  const res=keepTop(search(q,6));
  if(!res.length||res[0].score<3)return{md:'I could not find a strong match for that in the skill system. Try naming a technology (`fastapi`, `pandas`, `rag`, `docker`) or describe the project, for example `/plan a churn prediction model`.\n\nType `/help` to see what I can do.',src:[]};
  const top=res.slice(0,5);
  let md='For **'+short(q,90)+'**, these skills fit best:\n\n';
  top.forEach((r,i)=>{const why=matchedWhy(r.s,q);md+=(i+1)+'. '+sk(r.s.id)+' - '+short(r.s.desc,130)+(why.length?' *(matched: '+why.join(', ')+')*':'')+'\n'});
  const ph=[...new Set(top.flatMap(r=>phasesOf(r.s.id)))].sort((a,b)=>a-b);
  if(ph.length){
    md+='\n**Where they fit in the pipeline**\n\n';
    ph.forEach(i=>{const p=PH[i];md+='- **'+(i+1)+'. '+p.n+'** - agents: '+p.roles.slice(0,4).map(roleMd).join(', ')+'\n'});
  }
  const rl=top[0].s.rules||[];
  if(rl.length){md+='\n**Key rules from '+sk(top[0].s.id)+'**\n\n'+rl.slice(0,4).map(r=>'- '+r).join('\n')+'\n'}
  md+='\nWant the full path? Ask `/plan '+short(q,60)+'`.';
  return{md,src:top.map(r=>r.s.id)};
}
function plan(idea){
  idea=idea.trim();
  if(!idea)return{md:'Describe the project and I will lay it out across the 7 phases, for example:\n\n- `/plan a RAG support bot for our docs`\n- `/plan a fraud detection model with a FastAPI service`\n- `/plan a ChatGPT-style assistant with a premium UI`',src:[]};
  const res=keepTop(search(idea,14)),rank=Object.fromEntries(res.map((r,i)=>[r.s.id,i]));
  const hit=res.slice(0,4).map(r=>r.s.id);
  let md='## Plan: '+short(idea,100)+'\n\n'+(hit.length?'Strongest matches: '+hit.map(sk).join(', ')+'.\n':'No close skill matches, so each phase shows its defaults.\n');
  const src=new Set(hit);
  PH.forEach((p,i)=>{
    const matched=p.skills.filter(id=>id in rank).sort((a,b)=>rank[a]-rank[b]);
    const defaults=p.skills.filter(id=>!(id in rank)).slice(0,matched.length?1:3);
    const list=[...matched.slice(0,4),...defaults];
    list.forEach(id=>src.add(id));
    md+='\n### '+(i+1)+'. '+p.n+'\n';
    md+='**Agents:** '+p.roles.slice(0,4).map(roleMd).join(', ')+'\n\n';
    md+='**Skills:** '+(list.length?list.map(sk).join(', '):'none specific')+(matched.length?'':' *(defaults)*')+'\n\n';
    md+='**Done when:** '+p.out+'.\n';
  });
  md+='\nStart with `/research-first`, then run `/master-pipeline` to drive these phases. Roles in *italics* are pipeline roles without a dedicated agent file.';
  return{md,src:[...src].slice(0,10)};
}
function findSkill(name){
  name=name.trim().toLowerCase().replace(/^\//,'');
  if(byId[name])return byId[name];
  const alias={sklearn:'scikit-learn',hf:'huggingface',gpt:'gpt-chat-ui',claude:'claude-api'};
  if(alias[name]&&byId[alias[name]])return byId[alias[name]];
  const r=search(name,1,false);return r[0]&&r[0].score>4?r[0].s:null;
}
function skillAnswer(name){
  const s=findSkill(name);
  if(!s)return recommend(name);
  let md='### '+sk(s.id)+'\n*'+s.domain+(s.parent?' - part of `/'+s.parent+'`':'')+'*\n\n'+s.desc+'\n';
  if(s.triggers.length)md+='\n**Activates on:** '+s.triggers.slice(0,10).join(', ')+'\n';
  if(s.rules&&s.rules.length)md+='\n**Key rules**\n\n'+s.rules.map(r=>'- '+r).join('\n')+'\n';
  const ph=phasesOf(s.id);
  if(ph.length)md+='\n**Pipeline phase:** '+ph.map(i=>(i+1)+'. '+PH[i].n).join(', ')+'\n';
  const rel=keepTop(search(s.id.replace(/-/g,' ')+' '+s.triggers.join(' '),6,true).filter(r=>r.s.id!==s.id)).slice(0,3);
  if(rel.length)md+='\n**Related:** '+rel.map(r=>sk(r.s.id)).join(', ')+'\n';
  return{md,src:[s.id,...rel.map(r=>r.s.id)]};
}
function agentAnswer(name){
  name=name.trim().toLowerCase().replace(/^\//,'');
  const a=agentById[name]||KB.agents.find(x=>x.id.includes(name));
  if(!a)return{md:'No agent file called `'+name+'`. Available agents: '+KB.agents.map(x=>'`'+x.id+'`').join(', ')+'.',src:[]};
  const ph=PH.map((p,i)=>p.roles.includes(a.id)?i:-1).filter(i=>i>=0);
  let md='### `'+a.id+'` agent\n\n'+a.desc+'\n';
  if(ph.length){md+='\n**Runs in:** '+ph.map(i=>(i+1)+'. '+PH[i].n).join(', ')+'\n';const ss=[...new Set(ph.flatMap(i=>PH[i].skills))].slice(0,6);md+='\n**Pairs with skills:** '+ss.map(sk).join(', ')+'\n'}
  return{md,src:[]};
}
function phaseAnswer(n){
  n=parseInt(n);
  if(n>=1&&n<=7){
    const p=PH[n-1];
    return{md:'### Phase '+n+': '+p.n+'\n\n'+p.goal+'\n\n**Agents:** '+p.roles.map(roleMd).join(', ')+'\n\n**Skills:** '+p.skills.map(sk).join(', ')+'\n\n**Done when:** '+p.out+'.',src:p.skills.slice(0,6)};
  }
  let md='The master pipeline runs **seven phases**, from idea to production:\n\n';
  PH.forEach((p,i)=>{md+=(i+1)+'. **'+p.n+'** - '+p.goal+' Output: '+p.out+'.\n'});
  md+='\nAsk about one phase with `/phase 5`, or plan a project with `/plan <idea>`. Roles in *italics* are pipeline roles without a dedicated agent file.';
  return{md,src:[]};
}
function installAnswer(){
  return{md:'Run this from your project root:\n\n'+FENCE+'bash\ncurl -fsSL https://github.com/amutaal122/ai-engineer-master/raw/main/install.sh | bash\n'+FENCE+'\n\nOn Windows PowerShell:\n\n'+FENCE+'powershell\nirm https://github.com/amutaal122/ai-engineer-master/raw/main/install.ps1 | iex\n'+FENCE+'\n\nClaude Code reads `.claude/` natively. Every other tool needs a rules file, and `--tool` writes it for you:\n\n'+FENCE+'bash\ncurl -fsSL .../install.sh | bash -s -- --tool cursor\n'+FENCE+'\n\nValid values: `cursor`, `windsurf`, `copilot`, `cline`, `continue`, `zed`, `codex`, `all`. Add `--only fastapi,docker` to install just a few skills.\n\nCheck it worked with `bash .claude/doctor.sh`, then restart your editor. See `/easy-install` for offline install and troubleshooting.',src:['easy-install']};
}
function listAnswer(){
  const by={};core.forEach(s=>(by[s.domain]=by[s.domain]||[]).push(s.id));
  let md='The system has **'+core.length+' skills** ('+KB.skills.length+' counting research sub-skills), **'+KB.agents.length+' agents**, **'+KB.commands.length+' commands** and **'+KB.workflows.length+' workflows**.\n\n';
  Object.keys(by).forEach(d=>{md+='**'+d+'** ('+by[d].length+'): '+(by[d].length>9?by[d].slice(0,9).map(sk).join(', ')+' and more':by[d].map(sk).join(', '))+'\n\n'});
  return{md,src:[]};
}
function helpAnswer(){
  return{md:'I am grounded in your AI Engineer Master files, so I only recommend what is actually in them.\n\n- Describe a project or a problem and I pick the skills and agents\n- `/plan <idea>` lays it out across the 7 phases\n- `/skill <name>` explains one skill, `/agent <name>` one agent\n- `/phase <1-7>` details a phase, `/install` shows setup\n- Press `Ctrl K` to search everything\n\nIn Settings you can switch to a live model that gets the matching skill text as context.',src:[]};
}
function answer(q){
  const t=q.trim(),l=t.toLowerCase();let m;
  if((m=t.match(/^\/plan\b\s*([\s\S]*)/i)))return plan(m[1]);
  if((m=t.match(/^\/skill\s+(.+)/i)))return skillAnswer(m[1]);
  if((m=t.match(/^\/agent\s+(.+)/i)))return agentAnswer(m[1]);
  if((m=t.match(/^\/phase\s*(\d)?/i)))return phaseAnswer(m[1]);
  if(/^\/install/i.test(t)||/\b(install|set ?up|get started|getting started)\b/.test(l))return installAnswer();
  if(/^\/help/i.test(t)||/what can you (do|help)/.test(l))return helpAnswer();
  if(/\b(plan|roadmap|end to end|from scratch|step by step|how (do|should|would) i (build|ship|launch))\b/.test(l))return plan(t.replace(/^(plan|make a plan for)\s*/i,''));
  const n=l.match(/\bphase\s*(\d)\b/);if(n)return phaseAnswer(n[1]);
  const pn=PH.findIndex(p=>new RegExp('\\b'+p.n.toLowerCase()+' phase\\b|\\bthe '+p.n.toLowerCase()+' (phase|stage)\\b').test(l));if(pn>=0)return phaseAnswer(pn+1);
  if(/\b(pipeline|phases|workflow)\b/.test(l)&&!/\bbuild\b/.test(l))return phaseAnswer();
  if(/\b(list|how many)\b.*\b(skills|agents|commands)\b|\ball (the |your )?(skills|agents|commands)\b|\bwhat (skills|agents|commands) (do|are|exist)\b/.test(l))return listAnswer();
  const ag=KB.agents.find(a=>new RegExp('(^|[^a-z-])'+a.id+'([^a-z-]|$)').test(l));
  if(ag&&l.split(/\s+/).length<9)return agentAnswer(ag.id);
  const named=core.filter(s=>new RegExp('(^|[^a-z0-9-])'+s.id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9-]|$)').test(l));
  if(named.length===1&&l.split(/\s+/).length<9)return skillAnswer(named[0].id);
  return recommend(t);
}

  const by={};core.forEach(s=>(by[s.domain]=by[s.domain]||[]).push(s.id));

  return{text:c,src:res.map(r=>r.s.id)};

async function readSSE(res,fn){const rd=res.body.getReader(),dc=new TextDecoder();let b='';for(;;){const{value,done}=await rd.read();if(done)break;b+=dc.decode(value,{stream:true});const ls=b.split('\n');b=ls.pop();for(const l of ls)if(l.startsWith('data:'))fn(l.slice(5).trim())}}
async function errText(r){try{const j=await r.json();return(j.error&&j.error.message)||JSON.stringify(j)}catch(e){return r.status+' '+r.statusText}}
async function liveOpenAI(sys,msgs,tok_,sig){
  const st=S.settings;
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',signal:sig,headers:{'Content-Type':'application/json',Authorization:'Bearer '+st.key},body:JSON.stringify({model:st.model,temperature:.3,stream:true,messages:[{role:'system',content:sys},...msgs]})});
  if(!r.ok)throw new Error(await errText(r));
  await readSSE(r,d=>{if(d==='[DONE]')return;try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t)tok_(t)}catch(e){}});
}
async function liveAnthropic(sys,msgs,tok_,sig){
  const st=S.settings;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:sig,headers:{'Content-Type':'application/json','x-api-key':st.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:st.model,max_tokens:2048,temperature:.3,stream:true,system:sys,messages:msgs})});
  if(!r.ok)throw new Error(await errText(r));
  await readSSE(r,d=>{try{const j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)tok_(j.delta.text)}catch(e){}});
}

/* ---------- markdown ---------- */
function codeBlock(b){return '<div class="code"><div class="codebar"><span>'+esc(b.l||'text')+'</span><button type="button" data-copy>Copy</button></div><pre><code>'+esc(b.c.replace(/\n$/,''))+'</code></pre></div>'}
function md(src){
  const blocks=[];
  let s=src.replace(/(^|\n)```(\w*)\n?([\s\S]*?)(```|$)/g,(m,pre,l,c)=>{blocks.push({l,c});return pre+'\u0000'+(blocks.length-1)+'\u0000'});
  s=esc(s);
  const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const ln of s.split('\n')){
    let m;
    if((m=ln.match(/^\u0000(\d+)\u0000$/))){close();out+=codeBlock(blocks[+m[1]]);continue}
    if((m=ln.match(/^(#{1,4})\s+(.*)/))){close();const n=m[1].length+2;out+='<h'+n+'>'+inl(m[2])+'</h'+n+'>';continue}
    if((m=ln.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>';continue}
    if((m=ln.match(/^\s*\d+\.\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>';continue}
    close();if(ln.trim()==='')continue;out+='<p>'+inl(ln)+'</p>';
  }
  close();return out;
}

async function run(){
  const c=chat(),st=S.settings;
  const hist=c.messages.filter(m=>!m.error).map(m=>({role:m.role,content:m.content}));
  const a={role:'assistant',content:'',ts:Date.now(),streaming:true,src:[]};c.messages.push(a);
  ctrl=new AbortController();setBusy(true);pinned=true;renderThread();
  let raf=0;const upd=()=>{raf=0;const el=$('#msgs').lastElementChild?.querySelector('.md');if(el){el.innerHTML=md(a.content)+'<span class="cursor"></span>';linkify(el);if(pinned)$('#thread').scrollTop=$('#thread').scrollHeight}};
  const onTok=t=>{a.content+=t;if(!raf)raf=requestAnimationFrame(upd)};
  try{
    const q=hist[hist.length-1].content;
    if(st.provider==='offline'){
      const r=answer(q);a.src=r.src;
      const parts=r.md.match(/\S+\s*|\n+/g)||[];
      for(const p of parts){if(ctrl.signal.aborted)throw new DOMException('Aborted','AbortError');onTok(p);await sleep(8+Math.random()*14)}
    }else{
      if(!st.key)throw new Error('Add your API key in Settings, or switch to the offline expert.');
      const ctx=systemPrompt(q,st.k);a.src=ctx.src;
      await (st.provider==='openai'?liveOpenAI:liveAnthropic)(ctx.text,hist,onTok,ctrl.signal);
    }
  }catch(e){
    if(e.name!=='AbortError'){a.error=true;let m=e.message||String(e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))m='Could not reach the provider. If this page is inside a sandboxed viewer, outside API calls are blocked: save the file and open it locally. Otherwise check your connection and key.';a.content=(a.content?a.content+'\n\n':'')+'Error: '+m;a.src=[]}
  }finally{a.streaming=false;if(!a.content)a.content='(stopped)';c.updated=Date.now();ctrl=null;persist();setBusy(false);renderAll()}
}
function send(text){
  text=text.trim();if(!text||busy)return;
  if(view!=='chat')go('chat');
  let c=chat();if(!c){c={id:uid(),title:'New chat',messages:[],updated:Date.now()};S.chats.push(c);S.cur=c.id}
  c.messages.push({role:'user',content:text,ts:Date.now()});
  if(c.title==='New chat')c.title=short(text.replace(/^\/\w+\s*/,'')||text,38);
  c.updated=Date.now();$('#input').value='';autosize();renderAll();run();
}

$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';lsSet('aem.theme',r.dataset.theme)};
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.open?pal.close():palOpen()}
  if(e.key==='Escape'){if($('#drawer').classList.contains('on'))closeDrawer();else if(busy&&ctrl)ctrl.abort()}
});
const dlg=$('#dlg');
function toggleKey(){const o=$('#sProv').value==='offline';$('#sKey').disabled=o;$('#sModel').disabled=o;$('#sRem').disabled=o;$('#sK').disabled=o}
$('#gear').onclick=()=>{const st=S.settings;$('#sProv').value=st.provider;$('#sKey').value=st.key;$('#sRem').checked=st.remember;$('#sModel').value=st.model;$('#sK').value=st.k;$('#sKv').textContent=st.k;toggleKey();dlg.showModal?dlg.showModal():dlg.setAttribute('open','')};
$('#sProv').onchange=()=>{const p=$('#sProv').value;if(MODELS[p])$('#sModel').value=MODELS[p];toggleKey()};
$('#sK').oninput=()=>$('#sKv').textContent=$('#sK').value;
$('#sCancel').onclick=()=>dlg.close();
$('#sform').addEventListener('submit',()=>{const p=$('#sProv').value;S.settings={provider:p,key:$('#sKey').value.trim(),remember:$('#sRem').checked,model:$('#sModel').value.trim()||MODELS[p]||'',k:+$('#sK').value};persist();renderNote()});

load();
$('#send').innerHTML=SEND;$('#send').disabled=true;
renderAll();renderNav();
go(location.hash.slice(1)||'chat');
</script>
